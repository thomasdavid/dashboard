<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EWCS Dashboard (Feather / ArrowJS)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://code.highcharts.com/highcharts.js"></script>
<style>
  :root{--bg:#0c1022;--panel:#12193a;--muted:#9aa4b2;--text:#eef2f8;--accent:#3b82f6}
  *{box-sizing:border-box}body{margin:0;color:var(--text);background:#0e1530;font:14px/1.45 system-ui,Segoe UI,Roboto,Arial}
  header{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  h1{margin:0;font-size:18px}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
  .card{background:var(--panel);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  select,button,input[type="text"]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0f1837;color:var(--text)}
  button{cursor:pointer;background:#18235a}button:hover{background:#203072}
  .survey-buttons{display:flex;flex-wrap:wrap;gap:8px}
  .survey-buttons button{width:auto;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:#162258}
  .survey-buttons button.active{background:var(--accent);color:#fff;border-color:transparent}
  #log{font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:6px}
</style>
</head>
<body>
<header><h1>EWCS Dashboard</h1></header>

<div class="wrap">
  <div class="grid">
    <div class="card">
      <label>Feather source (remote in this repo)</label>
      <input id="remoteUrl" type="text" value="https://raw.githubusercontent.com/thomasdavid/dashboard/main/EWCS_combined_narrow.feather">
      <div style="margin:8px 0;text-align:center">— or —</div>
      <input id="localFeather" type="file" accept=".feather,.arrow" />
      <div id="log"></div>
    </div>
    <div class="card">
      <label>Surveys</label>
      <div class="survey-buttons" id="surveys"></div>
    </div>
    <div class="card">
      <label for="question">Question</label>
      <select id="question"></select>
    </div>
  </div>
  <div style="margin-top:12px" class="grid">
    <div class="card"><label>&nbsp;</label><button id="loadBtn">Load / Reload</button></div>
    <div class="card">
      <label for="limitCountries">Max countries</label>
      <select id="limitCountries">
        <option value="9999" selected>All</option>
        <option value="30">30</option><option value="25">25</option>
        <option value="20">20</option><option value="15">15</option>
      </select>
    </div>
    <div class="card">
      <label for="minPerc">Hide slices ≤ (%)</label>
      <select id="minPerc">
        <option value="0" selected>0</option><option value="0.5">0.5</option>
        <option value="1">1</option><option value="2">2</option><option value="5">5</option>
      </select>
    </div>
  </div>
  <div id="chart" style="height:900px;margin-top:18px"></div>
</div>

<!-- Arrow JS as an ES module -->
<script type="module">
import { tableFromIPC } from 'https://cdn.jsdelivr.net/npm/apache-arrow@14.0.2/esm/index.min.js';

const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += m + '\\n'; };

let ARROW_TABLE = null;   // the full Arrow table
let currentSurvey = null;

function numAwareSort(a,b){
  const na=Number(a), nb=Number(b);
  const an=!Number.isNaN(na), bn=!Number.isNaN(nb);
  return an&&bn?na-nb:String(a).localeCompare(String(b));
}

async function getFeatherBuffer(){
  const f = document.getElementById('localFeather');
  if (f.files && f.files[0]) {
    log('Reading local Feather…');
    return new Uint8Array(await f.files[0].arrayBuffer());
  }
  const url = document.getElementById('remoteUrl').value.trim();
  if(!url) throw new Error('No Feather URL provided.');
  log('Fetching Feather…');
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error(\`Feather HTTP \${r.status} \${r.statusText}\`);
  return new Uint8Array(await r.arrayBuffer());
}

function colToArray(table, name){
  const c = table.getChild(name);
  if(!c) return [];
  return c.toArray(); // typed array (numbers) or array of strings
}

async function loadTable(){
  const buf = await getFeatherBuffer();
  ARROW_TABLE = tableFromIPC(buf);
  log('Feather loaded. Rows: ' + ARROW_TABLE.numRows);
}

function distinct(arr){
  return [...new Set(arr.filter(x=>x!==null && x!==undefined))];
}

function subsetByMask(table, mask){
  // Build a tiny filtered object (only columns we need) to avoid copying full table
  const cols = {};
  for (const colName of ['survey','question','country','value']) {
    const col = table.getChild(colName);
    if (!col) continue;
    const src = col.toArray();
    const out = [];
    for (let i=0;i<src.length;i++) if (mask[i]) out.push(src[i]);
    cols[colName]=out;
  }
  return cols; // {survey:[…], question:[…], country:[…], value:[…]}
}

function buildMaskForSurvey(table, surveyVal){
  const s = table.getChild('survey').toArray();
  const mask = new Array(s.length);
  for (let i=0;i<s.length;i++) mask[i] = (s[i]===surveyVal);
  return mask;
}

function loadSurveysUI(){
  const surveys = distinct(colToArray(ARROW_TABLE,'survey')).sort();
  const el = document.getElementById('surveys');
  el.innerHTML='';
  surveys.forEach((s,i)=>{
    const b=document.createElement('button');
    b.textContent=s;
    if(i===0){ b.classList.add('active'); currentSurvey=s; }
    b.onclick=()=>{ currentSurvey=s; [...el.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); loadQuestionsUI(); };
    el.appendChild(b);
  });
  loadQuestionsUI();
}

function loadQuestionsUI(){
  if(!currentSurvey) return;
  const mask = buildMaskForSurvey(ARROW_TABLE, currentSurvey);
  const qCol = ARROW_TABLE.getChild('question').toArray();
  const qs = distinct(qCol.filter((_,i)=>mask[i])).sort();
  const elQ = document.getElementById('question');
  elQ.innerHTML='';
  qs.forEach((q,i)=>{ const o=document.createElement('option'); o.value=q; o.textContent=q; if(i===0) o.selected=true; elQ.appendChild(o); });
  drawChart(); // first render
  elQ.onchange = drawChart;
}

function drawChart(){
  const question = document.getElementById('question').value;
  const minPerc = parseFloat(document.getElementById('minPerc').value)||0;

  // Filter rows by current survey + question
  const surveyMask = buildMaskForSurvey(ARROW_TABLE, currentSurvey);
  const qCol = ARROW_TABLE.getChild('question').toArray();
  for (let i=0;i<surveyMask.length;i++) surveyMask[i] = surveyMask[i] && (qCol[i]===question);

  const small = subsetByMask(ARROW_TABLE, surveyMask); // {survey,question,country,value}

  // Build counts by (country, value)
  const key = (c,v)=>c+'\\u0001'+v;
  const counts = new Map();
  const n = small.country.length;
  for (let i=0;i<n;i++){
    const c = String(small.country[i]);
    const v = small.value[i] == null ? 'NA' : String(small.value[i]);
    const k = key(c,v);
    counts.set(k, (counts.get(k)||0)+1);
  }
  const countries = distinct(small.country.map(String)).sort(numAwareSort);
  const values = distinct(small.value.map(v=>v==null?'NA':String(v))).sort(numAwareSort);

  // Percent by country
  const totalByCountry = new Map();
  countries.forEach(c=>{
    let t=0;
    values.forEach(v=>{ t += counts.get(key(c,v))||0; });
    totalByCountry.set(c,t||1);
  });

  const series = values.map(v=>({
    name:v,
    data:countries.map(c=>{
      const pct = 100*(counts.get(key(c,v))||0)/totalByCountry.get(c);
      return pct <= minPerc ? 0 : pct;
    })
  }));

  Highcharts.chart('chart',{
    chart:{ type:'bar', backgroundColor:'transparent' },
    title:{ text:`${currentSurvey} • ${question} — Distribution by country`, style:{color:'#eef2f8'} },
    xAxis:{ categories:countries, labels:{ style:{color:'#eef2f8'} } },
    yAxis:{ min:0, max:100, title:{ text:'Percent', style:{color:'#eef2f8'} }, labels:{ format:'{value}%', style:{color:'#eef2f8'} } },
    legend:{ itemStyle:{color:'#eef2f8'} },
    tooltip:{ pointFormatter(){ return `<b>${this.series.name}</b>: ${this.y.toFixed(1)}%`; } },
    plotOptions:{ series:{ stacking:'percent' } },
    credits:{ enabled:false }, exporting:{ enabled:false },
    series
  });
}

document.getElementById('loadBtn').addEventListener('click', async ()=>{
  try{
    logEl.textContent='';
    await loadTable();
    loadSurveysUI();
  }catch(e){
    log('Error: ' + (e.message || e));
    console.error(e);
  }
});

// Auto-load on open
document.getElementById('loadBtn').click();
</script>
</body>
</html>
