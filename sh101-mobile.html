<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=4, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#191a17">
  <title>SH-101 Vibe</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #191a17;
      overscroll-behavior: none;
      touch-action: pan-x pan-y pinch-zoom;
      -webkit-overflow-scrolling: touch;
    }

    #synth-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: 0;
      display: block;
      background: #191a17;
      touch-action: pan-x pan-y pinch-zoom;
      transform-origin: center center;
    }

    #dedication {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 5;
      pointer-events: none;
      color: #c8c9c5;
      font: italic 600 11px/1.2 Arial, Helvetica, sans-serif;
      letter-spacing: .04em;
      text-shadow: 0 1px 0 rgba(255,255,255,.18), 0 -1px 0 rgba(0,0,0,.65);
      opacity: .86;
      white-space: nowrap;
      transform-origin: center center;
    }

    /* If the phone is upright, rotate the entire instrument into a landscape canvas. */
    @media (orientation: portrait) and (max-width: 900px) {
      #synth-frame {
        inset: auto;
        top: 50%;
        left: 50%;
        width: 100dvh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }

      #dedication {
        right: auto;
        bottom: auto;
        left: max(10px, env(safe-area-inset-left));
        top: 14px;
        transform: rotate(90deg) translateY(-100%);
      }
    }

    @media (orientation: landscape) {
      #synth-frame { transform: none; }
      #dedication { transform: none; }
    }
  </style>
</head>
<body>
  <iframe
    id="synth-frame"
    src="./sh101vibe2.html"
    title="SH-101 Vibe synthesizer"
    allow="autoplay; fullscreen"
    allowfullscreen
  ></iframe>

  <div id="dedication" aria-hidden="true">For Serena x</div>

  <script>
    const synthFrame = document.getElementById('synth-frame');

    function enableTouchNavigationInsideSynth() {
      try {
        const doc = synthFrame.contentDocument;
        if (!doc) return;

        let viewport = doc.querySelector('meta[name="viewport"]');
        if (!viewport) {
          viewport = doc.createElement('meta');
          viewport.name = 'viewport';
          doc.head.appendChild(viewport);
        }
        viewport.content = 'width=1000, initial-scale=1, minimum-scale=0.5, maximum-scale=4, user-scalable=yes, viewport-fit=cover';

        doc.documentElement.style.overflow = 'auto';
        doc.documentElement.style.touchAction = 'pan-x pan-y pinch-zoom';
        doc.body.style.overflow = 'auto';
        doc.body.style.touchAction = 'pan-x pan-y pinch-zoom';
        doc.body.style.webkitOverflowScrolling = 'touch';
      } catch (_) {
        // Same-origin access should work; the synth remains usable if unavailable.
      }
    }

    synthFrame.addEventListener('load', enableTouchNavigationInsideSynth);

    async function requestLandscapeLock() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (_) {
        // The CSS rotation above is the fallback for browsers that block locking.
      }
    }

    document.addEventListener('pointerdown', requestLandscapeLock, { once: true, passive: true });
    document.addEventListener('touchend', requestLandscapeLock, { once: true, passive: true });
  </script>
</body>
</html>
