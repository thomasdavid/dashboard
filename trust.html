<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Trust beeswarm – year dropdown</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.7.0/css/flag-icons.min.css"/>
<style>
  :root{
    /* diverging scheme: orange (low) – grey (mid) – blue (high) */
    --low:#C35A08; --mid:#C8CED3; --high:#0B3D56;
    --ink:#222c4c; --axis:#bfbfbf; --grid:#e9e9e9;
    --chart-left: 270px; /* keep in sync with SVG left margin if needed */
  }

  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#fff}
  .wrap{max-width:1200px;margin:20px auto;padding:0 12px}

  /* ───────── Top controls: year (left) + country (right), centered ───────── */
  .top-controls{
    display:flex; flex-direction:column; align-items:center;
    gap:10px; margin:6px 0 12px;
  }
  .controls-row{
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .legend-row{ margin-top:4px; }

  /* ───────── Select + clear (×) ───────── */
  .select-wrap{ position:relative; display:inline-block }
  .select-wrap select{
    min-width: 220px;
    padding: 10px 44px 10px 14px;
    border: 1px solid #d5dbe3; border-radius: 12px; background:#fff;
    font-size: 14px; line-height:1; color:#111;
    appearance:none; background-image:none;   /* no chevron */
  }
  /* make the year dropdown a bit narrower */
  .select-wrap.year select{ min-width: 140px; }

  .select-wrap select:focus{
    outline:none; border-color:#b8c2cf; box-shadow:0 0 0 3px rgba(0,0,0,.04);
  }
  /* faded placeholder look while required select is on the hidden empty option */
  .select-wrap select:invalid{ color:#8b95a3; }
  .select-wrap option{ color:#111; }

  .clear-btn{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; border:0; background:transparent;
    color:#111; font-size:22px; line-height:1; padding:0; cursor:pointer;
  }
  .clear-btn:hover{ color:#000; transform:translateY(-50%) scale(1.05); }
  .clear-btn:active{ transform:translateY(-50%) scale(.98); }
  .clear-btn[hidden]{ display:none; }

  /* EU legend chip */
  .legend-eu{display:flex;align-items:center;gap:8px;color:#333;font-size:14px}
  .legend-eu .chip{width:14px;height:14px;border-radius:50%;background:var(--mid);outline:2px solid #000;outline-offset:-1px}

  /* chart */
  svg{display:block;width:100%;height:auto}
  .label{fill:#111;font-size:18px;font-weight:600;dominant-baseline:middle}
  .row-rule{stroke:var(--grid);stroke-width:1}
  .dot{stroke:#fff;stroke-width:1}
  .dot.emph{stroke:var(--ink);stroke-width:2}
  .eu-dot{stroke:#000;stroke-width:2}

  .highlight{
    fill:none; stroke:#6b7280; stroke-opacity:.45; stroke-width:1.8;
    stroke-linecap:round; pointer-events:none;
  }
  .highlight-pin{ fill:none; stroke:#0f1d3a; stroke-width:.5; pointer-events:none; }

  .x-axis line,.x-axis path{stroke:var(--axis)}
  .axis-cues text{font-size:18px;font-weight:800}
  .axis-cues .low{fill:var(--low)}
  .axis-cues .avg{fill:#6b6f76;font-weight:700}
  .axis-cues .high{fill:#0B3D56}

  .name-fo{pointer-events:none}
  .flag-row{
    display:flex; align-items:center; gap:6px;
    font-weight:800; font-size:18px; color:#111; line-height:1;
    text-shadow:0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff, 0 0 3px rgba(255,255,255,.95);
    white-space:nowrap;
  }

  .tooltip{
    position:fixed;background:#111;color:#fff;padding:8px 10px;border-radius:8px;
    font-size:13px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18)
  }
</style>
</head>
<body>
<div class="wrap">
  <h2 style="margin:8px 0 6px">Trust indicators dashboard</h2>

  <!-- TOP CONTROLS: Year (left) + Country (right), both centered; legend below -->
  <header class="top-controls">
    <div class="controls-row">
      <!-- Year dropdown -->
      <div class="select-wrap year">
        <select id="yearSel" required>
          <option value="" disabled selected hidden>Select year</option>
        </select>
      </div>

      <!-- Country dropdown with clear button -->
      <div class="select-wrap">
        <select id="countrySel" required>
          <option value="" disabled selected hidden>Select a country</option>
        </select>
        <button id="clearSel" class="clear-btn" hidden aria-label="Clear selection">×</button>
      </div>
    </div>

    <!-- EU legend row -->
    <div class="legend-row">
      <div class="legend-eu" title="EU27 average">
        <div class="chip"></div><span>EU27 average</span>
      </div>
    </div>
  </header>

  <svg id="chart" width="1100" height="640" viewBox="0 0 1100 640" aria-label="beeswarm chart"></svg>
</div>

<div id="tooltip" class="tooltip" style="display:none"></div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/thomasdavid/dashboard/main/Trust.csv";

/* flag-icons codes */
const FLAG_CODE = {
  "European Union":"eu","Austria":"at","Belgium":"be","Bulgaria":"bg","Croatia":"hr",
  "Cyprus":"cy","Czechia":"cz","Denmark":"dk","Estonia":"ee","Finland":"fi","France":"fr",
  "Germany":"de","Greece":"gr","Hungary":"hu","Ireland":"ie","Italy":"it","Latvia":"lv",
  "Lithuania":"lt","Luxembourg":"lu","Malta":"mt","Netherlands":"nl","Poland":"pl",
  "Portugal":"pt","Romania":"ro","Slovakia":"sk","Slovenia":"si","Spain":"es","Sweden":"se"
};

/* ---------- chart setup ---------- */
const svg = d3.select("#chart");
const width = +svg.attr("width");
const margin = { top:4, right:28, bottom:110, left:270 };
const rowGap = 90;
const r = 6;
const innerW = width - margin.left - margin.right;

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const x = d3.scaleLinear().domain([1,8]).range([0, innerW]);
const rowY = i => i*rowGap;

const interp = d3.interpolateRgbBasis([css("--low"), css("--mid"), css("--high")]);
const color = d3.scaleDiverging().domain([1,5,8]).interpolator(interp);
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* layers */
const dotsG = g.append("g");
const hiG   = g.append("g").attr("class","highlight-layer");
const nameG = g.append("g").attr("class","name-layer");
dotsG.raise();

/* tooltip */
const tip = document.getElementById("tooltip");
function showTip(e, p){
  tip.style.display = "block";
  tip.style.left = (e.clientX + 12) + "px";
  tip.style.top  = (e.clientY + 12) + "px";
  tip.innerHTML = `<strong>${p.Country==="European Union"?"European Union":p.Country}</strong><br>${p.Metric}: ${p.value}`;
}
function hideTip(){ tip.style.display = "none"; }

/* fade helpers */
const FADE_OTHER = 0.2;
function setFade(country){
  dotsG.selectAll("circle")
    .classed("emph", d => d.Country === country)
    .transition().duration(180)
    .attr("opacity", d => d.Country === country ? 1 : FADE_OTHER);
}
function clearFade(){
  dotsG.selectAll("circle").classed("emph", false)
    .transition().duration(180).attr("opacity", 1);
}

/* controls */
const yearSel  = document.getElementById("yearSel");
const sel      = document.getElementById("countrySel");
const clearBtn = document.getElementById("clearSel");

let selected = "";
let categories = [];
let points = [];
let years = [];
let curYear = null;

/* ---------- load & init ---------- */
let allRows = [];
d3.csv(CSV_URL, d3.autoType).then(init);

function init(rows){
  allRows = rows.map(d => ({ Year:+d.Year, Metric:String(d.Metric), Country:String(d.Country), Score:+d.Score }));

  years = Array.from(new Set(allRows.map(d=>d.Year))).sort(d3.ascending);
  curYear = d3.max(years); // initial view uses latest year

  // populate Year dropdown (latest first so it’s easy to pick)
  [...years].sort((a,b)=>b-a).forEach(y => yearSel.add(new Option(y, y)));

  // metrics sorted by EU value for initial year
  const byYear = allRows.filter(d=>d.Year===curYear);
  const metrics = Array.from(new Set(byYear.map(d=>d.Metric)));
  const euVal = Object.fromEntries(metrics.map(m => {
    const r = byYear.find(d=>d.Metric===m && d.Country==="European Union");
    return [m, r? r.Score : NaN];
  }));
  categories = metrics.slice().sort((a,b)=> d3.descending(euVal[a], euVal[b]));

  // chart height / rules / labels
  const rowsHeight = (categories.length-1)*rowGap;
  const cuesOffset = rowsHeight + 78;
  const axisOffset = cuesOffset + 24;
  const totalH = margin.top + margin.bottom + axisOffset + 40;
  svg.attr("height", totalH);

  categories.forEach((lab,i)=>{
    g.append("text").attr("class","label").attr("x",-16).attr("y",rowY(i)).attr("text-anchor","end").text(lab);
    g.append("line").attr("class","row-rule").attr("x1",0).attr("x2",innerW)
      .attr("y1", rowY(i) + r + 38).attr("y2", rowY(i) + r + 38);
  });
  const lastRuleY = (i => rowY(i) + r + 38)(categories.length-1);
  g.append("line").attr("x1", x(5)).attr("x2", x(5)).attr("y1", 0).attr("y2", lastRuleY).attr("stroke", "#d6d6d6");

  // cues below rows (no numeric axis)
  const cues = g.append("g").attr("class","axis-cues").attr("transform", `translate(0,${rowsHeight + 78})`);
  cues.append("text").attr("class","low").attr("x", x(1)).attr("text-anchor","start").text("← Lower trust");
  cues.append("text").attr("class","avg").attr("x", x(4.5)).attr("text-anchor","middle").text("");
  cues.append("text").attr("class","high").attr("x", x(8)).attr("text-anchor","end").text("Higher trust →");

  // first render
  points = buildPoints(byYear);
  beeswarm(points);
  drawDots();

  // country select (EU first, then A–Z)
  const allCountries = Array.from(new Set(byYear.map(d=>d.Country))).filter(Boolean);
  const ordered = ["European Union", ...allCountries.filter(c => c !== "European Union").sort((a,b)=>a.localeCompare(b))];
  ordered.forEach(c => sel.add(new Option(c, c)));

  // handlers
  yearSel.addEventListener("change", ()=>{
    const val = yearSel.value;
    if (!val) return;
    const y = +val;
    if (y === curYear) return;
    curYear = y;
    updateYear(allRows.filter(d=>d.Year===curYear));
  });

  sel.addEventListener("change", ()=>{
    selected = sel.value;
    clearBtn.hidden = !selected;
    if (selected){ setFade(selected); drawHighlight(selected, true); }
    else { clearFade(); clearHighlight(); }
  });

  clearBtn.addEventListener("click", ()=>{
    sel.value = ""; selected = ""; clearBtn.hidden = true; clearFade(); clearHighlight();
  });
}

/* ---------- building & layout ---------- */
function buildPoints(rows){
  const pts=[];
  categories.forEach((cat,i)=>{
    rows.filter(d=>d.Metric===cat).forEach(d=>{
      pts.push({
        id:`${d.Country}-${cat}`,
        Country:d.Country,
        Metric:cat,
        value:d.Score,
        x:x(d.Score),
        y:rowY(i)
      });
    });
  });
  return pts;
}

function beeswarm(pts, prevMap){
  categories.forEach((cat,i)=>{
    const rowPts = pts.filter(p=>p.Metric===cat);
    if (prevMap){
      rowPts.forEach(p=>{
        const pr = prevMap.get(p.id);
        if (pr){ p.x = pr.x; p.y = pr.y; }
      });
    }
    const sim = d3.forceSimulation(rowPts)
      .alpha(0.9)
      .force("x", d3.forceX(p=>x(p.value)).strength(0.8))
      .force("y", d3.forceY(rowY(i)).strength(0.15))
      .force("collide", d3.forceCollide(r+1.4))
      .stop();
    for (let k=0;k<250;k++) sim.tick();
  });
}

/* ---------- drawing ---------- */
function drawDots(){
  const selDots = dotsG.selectAll("circle").data(points, d=>d.id);

  selDots.join(
    enter => enter.append("circle")
      .attr("r", r)
      .attr("cx", d=>d.x)
      .attr("cy", d=>d.y)
      .attr("class", d => d.Country==="European Union" ? "dot eu-dot" : "dot")
      .attr("fill", d => color(d.value))
      .attr("opacity", 1),
    update => update,
    exit => exit.remove()
  )
  .on("mouseenter", (e,d)=>{ showTip(e,d); if(!selected){ setFade(d.Country); drawHighlight(d.Country, false); } })
  .on("mousemove",  (e,d)=>{ showTip(e,d); })
  .on("mouseleave", (e,d)=>{ hideTip(); if(!selected){ clearFade(); clearHighlight(); } });
}

function updateYear(rowsForYear){
  const prevMap = new Map(points.map(p=>[p.id, {x:p.x, y:p.y}]));
  const newPts = buildPoints(rowsForYear);
  beeswarm(newPts, prevMap);
  points = newPts;

  dotsG.selectAll("circle").data(points, d=>d.id)
    .join(
      enter => enter.append("circle")
        .attr("r", r).attr("cx", d=>d.x).attr("cy", d=>d.y)
        .attr("class", d => d.Country==="European Union" ? "dot eu-dot" : "dot")
        .attr("fill", d => color(d.value))
        .attr("opacity", selected ? (d => d.Country===selected ? 1 : 0.2) : 1),
      update => update,
      exit => exit.remove()
    )
    .transition().duration(600).ease(d3.easeCubicInOut)
    .attr("cx", d=>d.x).attr("cy", d=>d.y)
    .attr("fill", d => color(d.value));

  drawDots(); // rebind events

  if (selected){
    setFade(selected);
    drawHighlight(selected, false); // no draw-on animation during year change
  }
}

/* ---------- highlight & label ---------- */
function drawSelectedName(country){
  nameG.selectAll("*").remove();
  if (!country) return;

  const firstCat = categories[0];
  const pt = points.find(p=>p.Country===country && p.Metric===firstCat);
  if (!pt) return;

  const label = country === "European Union" ? "European Union" : country;
  const meas = nameG.append("text").attr("font-weight",800).attr("font-size",18).text(label);
  const wText = meas.node().getBBox().width; meas.remove();
  const iso = (FLAG_CODE[country] || "").toLowerCase();
  const wFlag = iso ? 18 : 0, pad = iso ? 6 : 0;
  const total = wFlag + pad + wText;

  const baseX = pt.x - total/2;
  const baseY = rowY(0) - 28;

  nameG.append("foreignObject")
    .attr("class","name-fo")
    .attr("x", baseX).attr("y", baseY-12)
    .attr("width", total).attr("height", 26)
    .html(`
      <div xmlns="http://www.w3.org/1999/xhtml" class="flag-row">
        ${iso ? `<span class="fi fi-${iso}"></span>` : ``}
        <span>${label}</span>
      </div>
    `);
}

function drawHighlight(country, animate=false){
  hiG.selectAll("*").remove();

  const cPts = categories.map(cat => points.find(p=>p.Country===country && p.Metric===cat)).filter(Boolean);
  if (!cPts.length) { drawSelectedName(""); return; }

  const line = d3.line().x(d=>d.x).y(d=>d.y).curve(d3.curveCatmullRom.alpha(0.8));
  const path = hiG.append("path").attr("class","highlight").attr("d", line(cPts));

  if (animate){
    const L = path.node().getTotalLength();
    path.attr("stroke-dasharray", `${L} ${L}`)
        .attr("stroke-dashoffset", L)
        .transition().duration(1000).ease(d3.easeCubicInOut)
        .attr("stroke-dashoffset", 0);
  }

  cPts.forEach(p=>{
    hiG.append("circle")
      .attr("class","highlight-pin")
      .attr("r", r+2)
      .attr("cx", p.x)
      .attr("cy", p.y)
      .attr("fill","none");
  });

  drawSelectedName(country);
}

function clearHighlight(){
  hiG.selectAll("*").remove();
  nameG.selectAll("*").remove();
}
</script>
</body>
</html>
