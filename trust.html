<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Trust beeswarm – matched band + instant hover</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.7.0/css/flag-icons.min.css"/>
<style>
  :root{
    --low:#C35A08; --mid:#C8CED3; --high:#0B3D56; --second:#1B2110;
    --ink:#222c4c; --axis:#bfbfbf; --grid:#e9e9e9;
  }

  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#fff}
  .wrap{max-width:1200px;margin:20px auto;padding:0 12px}
  h2{margin:8px 0 6px;text-align:center}

  .controls-stack{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 6px}
  .controls-row{display:flex;align-items:center;justify-content:center;gap:12px}
  .legend-row{margin-top:2px;transform:scale(.9);transform-origin:center}

  .select-wrap{position:relative;display:inline-block}
  .select-wrap select{
    min-width:240px;padding:10px 40px 10px 14px;border:1px solid #d5dbe3;border-radius:12px;background:#fff;
    font-size:14px;line-height:1;color:#111;appearance:none;background-image:none;
  }
  .select-wrap select:focus{outline:none;border-color:#b8c2cf;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
  .select-wrap.year select{
    min-width:150px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="%23222" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat:no-repeat;background-position:right 12px center;background-size:12px 8px;
  }
  .select-wrap.year select.soft{color:#7c8796}
  .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:#111;font-size:22px;line-height:1;padding:0;cursor:pointer}
  .clear-btn:hover{color:#000;transform:translateY(-50%) scale(1.05)}
  .clear-btn:active{transform:translateY(-50%) scale(.98)}
  .clear-btn[hidden]{display:none}

  .legend-eu{display:flex;align-items:center;gap:8px;color:#333;font-size:14px}
  .legend-eu .chip{width:14px;height:14px;border-radius:50%;background:var(--mid);outline:2px solid #000;outline-offset:-1px}

  svg{display:block;width:100%;height:auto}
  .label{fill:#111;font-size:18px;font-weight:600;dominant-baseline:middle}
  .row-rule{stroke:var(--grid);stroke-width:1}
  .dot{stroke:#fff;stroke-width:1}
  .dot.emph{stroke:var(--ink);stroke-width:2}
  .eu-dot{stroke:#000;stroke-width:3} /* EU outline = 3px */

  .highlight{fill:none;stroke:#6b7280;stroke-opacity:.55;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
  .highlight-pin{fill:none;stroke:#0f1d3a;stroke-width:.6;pointer-events:none}

  .highlight.second{stroke:var(--high);stroke-opacity:.55}
  .highlight-pin.second{stroke:var(--high);stroke-opacity:.6}

  .band-layer{pointer-events:none}
  .between-band{
    fill:#0B3D56;
    fill-opacity:.02;    /* tweak this and stroke-opacity to adjust visibility */
    stroke:#0B3D56;
    stroke-opacity:.12;
    stroke-width:0;
    mix-blend-mode:multiply;
  }

  .axis-cues text{font-size:22px;font-weight:800}
  .axis-cues .low{fill:var(--low)} .axis-cues .avg{fill:#6b6f76;font-weight:700} .axis-cues .high{fill:#0B3D56}

  .name-fo{pointer-events:none}
  .flag-row{
    display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;color:#111;line-height:1;
    text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff,0 0 3px rgba(255,255,255,.95);
    white-space:nowrap;
  }
  .tooltip{position:fixed;background:#111;color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="wrap">
  <h2>Trust indicators dashboard</h2>

  <header class="controls-stack">
    <div class="controls-row">
      <div class="select-wrap">
        <select id="countrySel" required>
          <option id="countryDisplay" value="" disabled selected hidden>Select a country</option>
        </select>
        <button id="clearSel" class="clear-btn" hidden aria-label="Clear selection">×</button>
      </div>
      <div class="select-wrap year">
        <select id="yearSel" required class="soft"></select>
      </div>
    </div>
    <div class="legend-row">
      <div class="legend-eu" title="EU27 average"><div class="chip"></div><span>EU27 average</span></div>
    </div>
  </header>

  <svg id="chart" width="1100" height="640" viewBox="0 0 1100 640" aria-label="beeswarm chart"></svg>
</div>

<div id="tooltip" class="tooltip" style="display:none"></div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/thomasdavid/dashboard/main/Trust.csv";
const FLAG_CODE = {"European Union":"eu","Austria":"at","Belgium":"be","Bulgaria":"bg","Croatia":"hr","Cyprus":"cy","Czechia":"cz","Denmark":"dk","Estonia":"ee","Finland":"fi","France":"fr","Germany":"de","Greece":"gr","Hungary":"hu","Ireland":"ie","Italy":"it","Latvia":"lv","Lithuania":"lt","Luxembourg":"lu","Malta":"mt","Netherlands":"nl","Poland":"pl","Portugal":"pt","Romania":"ro","Slovakia":"sk","Slovenia":"si","Spain":"es","Sweden":"se"};

/* chart setup */
const svg = d3.select("#chart");
const width = +svg.attr("width");
const margin = { top:4, right:28, bottom:110, left:270 };
const rowGap = 90, r = 6, innerW = width - margin.left - margin.right;
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const x = d3.scaleLinear().domain([1,8]).range([0, innerW]);
const rowY = i => i*rowGap;
const labelLeft = -margin.left + 24;

const color = d3.scaleDiverging()
  .domain([1,5,8])
  .interpolator(d3.interpolateRgbBasis([css("--low"), css("--mid"), css("--high")]));
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* shared curve */
const curve = d3.curveCatmullRom.alpha(0.8);
const lineGen = d3.line().x(d=>d.x).y(d=>d.y).curve(curve);

/* layers */
const dotsG = g.append("g");
const bandG = g.append("g").attr("class","band-layer");
const layers = {
  A: { g: g.append("g").attr("class","layer-A"), labelG: g.append("g").attr("class","label-A") },
  B: { g: g.append("g").attr("class","layer-B"), labelG: g.append("g").attr("class","label-B") }
};
dotsG.raise();

/* tooltip */
const tip = document.getElementById("tooltip");
function showTip(e, p){ tip.style.display="block"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY+12)+"px"; tip.innerHTML=`<strong>${p.Country==="European Union"?"European Union":p.Country}</strong><br>${p.Metric}: ${p.value}`; }
function hideTip(){ tip.style.display="none"; }

/* fade helpers */
const FADE_OTHER = 0.2;
function applyFade(set){
  dotsG.selectAll("circle")
    .classed("emph", d => set.has(d.Country))
    .attr("opacity", d => set.size ? (set.has(d.Country) ? 1 : FADE_OTHER) : 1);
}

/* controls / state */
const yearSel        = document.getElementById("yearSel");
const countrySel     = document.getElementById("countrySel");
const countryDisplay = document.getElementById("countryDisplay");
const clearBtn       = document.getElementById("clearSel");

let selectedCountries = []; // slot 0 = A, slot 1 = B
let categories = [];
let points = [];
let years = [];
let curYear = null;
let allRows = [];

/* load */
d3.csv(CSV_URL, d3.autoType).then(init);

function init(rows){
  allRows = rows.map(d => ({ Year:+d.Year, Metric:String(d.Metric), Country:String(d.Country), Score:+d.Score }));
  years = Array.from(new Set(allRows.map(d=>d.Year))).sort(d3.ascending);
  curYear = d3.max(years);

  // populate year
  [...years].sort((a,b)=>b-a).forEach(y => yearSel.add(new Option(y, y, false, y===curYear)));
  yearSel.classList.add('soft');
  yearSel.addEventListener('change', ()=> yearSel.classList.remove('soft'));

  const byYear = allRows.filter(d=>d.Year===curYear);
  const metrics = Array.from(new Set(byYear.map(d=>d.Metric)));
  const euVal = Object.fromEntries(metrics.map(m => {
    const r = byYear.find(d=>d.Metric===m && d.Country==="European Union");
    return [m, r? r.Score : NaN];
  }));
  categories = metrics.slice().sort((a,b)=> d3.descending(euVal[a], euVal[b]));

  // static scaffolding
  const rowsHeight = (categories.length-1)*rowGap;
  const totalH = margin.top + margin.bottom + (rowsHeight + 78 + 24) + 40;
  svg.attr("height", totalH);

  categories.forEach((lab,i)=>{
    g.append("text").attr("class","label")
      .attr("x", labelLeft).attr("y", rowY(i)).attr("text-anchor","start").text(lab);
    g.append("line").attr("class","row-rule")
      .attr("x1", labelLeft).attr("x2", innerW)
      .attr("y1", rowY(i) + r + 38).attr("y2", rowY(i) + r + 38);
  });
  const lastRuleY = (i => rowY(i) + r + 38)(categories.length-1);
  g.append("line").attr("x1", x(5)).attr("x2", x(5)).attr("y1", 0).attr("y2", lastRuleY).attr("stroke", "#d6d6d6");

  const cues = g.append("g").attr("class","axis-cues").attr("transform", `translate(0,${rowsHeight + 78})`);
  cues.append("text").attr("class","low").attr("x", x(1.2)).attr("text-anchor","start").text("← Lower trust");
  cues.append("text").attr("class","avg").attr("x", x(4.5)).attr("text-anchor","middle").text("");
  cues.append("text").attr("class","high").attr("x", x(7.5)).attr("text-anchor","end").text("Higher trust →");

  // dots
  points = buildPoints(byYear);
  beeswarm(points);
  drawDots();

  // country list
  const allCountries = Array.from(new Set(byYear.map(d=>d.Country))).filter(Boolean);
  const ordered = ["European Union", ...allCountries.filter(c => c !== "European Union").sort((a,b)=>a.localeCompare(b))];
  ordered.forEach(c => countrySel.add(new Option(c, c)));

  // handlers
  yearSel.addEventListener("change", ()=>{
    const y = +yearSel.value;
    if (y === curYear) return;

    const prevMap = new Map(points.map(p=>[p.id, {x:p.x, y:p.y}]));
    const prevByCountry = {};
    selectedCountries.forEach(c => prevByCountry[c] = getCountryRowPoints(prevMap, c));

    curYear = y;
    updateYear(allRows.filter(d=>d.Year===curYear), prevMap, prevByCountry);
  });

  countrySel.addEventListener("change", ()=>{
    const choice = countrySel.value;
    if (!choice) return;
    addCountry(choice, /*animateNew*/true);
    countrySel.value = "";
  });

  clearBtn.addEventListener("click", ()=>{
    selectedCountries=[]; updateCountryDisplay(); applyFade(new Set()); clearLayers();
  });
}

/* add country (from dropdown or dot click) */
function addCountry(choice, animateNew){
  if (selectedCountries.includes(choice)) return;
  if (selectedCountries.length >= 2){
    // drop oldest, shift second to first
    selectedCountries = [ selectedCountries[1] ];
  }
  selectedCountries.push(choice);
  updateCountryDisplay();
  renderSelectedLayers(animateNew);
}

/* select label */
function updateCountryDisplay(){
  clearBtn.hidden = selectedCountries.length === 0;
  countryDisplay.textContent = selectedCountries.length ? selectedCountries.join(", ") : "Select a country";
  countryDisplay.disabled = true; countryDisplay.selected = true; countryDisplay.hidden = !selectedCountries.length;
}

/* build/layout */
function buildPoints(rows){
  const pts=[];
  categories.forEach((cat,i)=>{
    rows.filter(d=>d.Metric===cat).forEach(d=>{
      pts.push({ id:`${d.Country}-${cat}`, Country:d.Country, Metric:cat, value:d.Score, x:x(d.Score), y:rowY(i) });
    });
  });
  return pts;
}
function beeswarm(pts, prevMap){
  categories.forEach((cat,i)=>{
    const rowPts = pts.filter(p=>p.Metric===cat);
    if (prevMap){
      rowPts.forEach(p=>{ const pr=prevMap.get(p.id); if(pr){ p.x=pr.x; p.y=pr.y; }});
    }
    const sim = d3.forceSimulation(rowPts)
      .alpha(0.9)
      .force("x", d3.forceX(p=>x(p.value)).strength(0.8))
      .force("y", d3.forceY(rowY(i)).strength(0.15))
      .force("collide", d3.forceCollide(r+1.4))
      .stop();
    for (let k=0;k<250;k++) sim.tick();
  });
}

/* dots + hover (instant), and CLICK to select */
function drawDots(){
  const selDots = dotsG.selectAll("circle").data(points, d=>d.id);
  selDots.join(
    enter => enter.append("circle")
      .attr("r", r).attr("cx", d=>d.x).attr("cy", d=>d.y)
      .attr("class", d => d.Country==="European Union" ? "dot eu-dot" : "dot")
      .attr("fill", d => color(d.value)).attr("opacity", 1),
    update => update, exit => exit.remove()
  )
  .on("mouseenter", (e,d)=>{
      showTip(e,d);
      if(!selectedCountries.length){
        applyFade(new Set([d.Country]));
        drawLayer(layers.A, getCountryRowPoints(points, d.Country), false, /*animate*/false);
        drawLabel(layers.A.labelG, d.Country, -28);
      }
    })
  .on("mousemove",  (e,d)=>{ showTip(e,d); })
  .on("mouseleave", ()=>{
      hideTip();
      if(!selectedCountries.length){
        applyFade(new Set());
        clearLayer(layers.A);
      }
    })
  .on("click", (e,d)=>{           /* NEW: click-to-select */
      addCountry(d.Country, /*animateNew*/true);
    });
}

/* helpers */
function getCountryRowPoints(mapOrPoints, country){
  if (mapOrPoints instanceof Map){
    return categories.map(cat=>{
      const id = `${country}-${cat}`; const p = mapOrPoints.get(id);
      return p ? {x:p.x, y:rowY(categories.indexOf(cat))} : null;
    }).filter(Boolean);
  } else {
    return categories.map(cat => mapOrPoints.find(p=>p.Country===country && p.Metric===cat)).filter(Boolean);
  }
}

/* band helpers */
function clearBand(){ bandG.selectAll("*").remove(); }
function bandPath(pointsA, pointsB){
  const dA = lineGen(pointsA);
  const dB = lineGen(pointsB.slice().reverse());
  return dA + dB.replace(/^M/,'L') + 'Z';
}
function drawBetweenBand(countryA, countryB, animate=false){
  if(!countryA || !countryB){ clearBand(); return; }
  const a = getCountryRowPoints(points, countryA);
  const b = getCountryRowPoints(points, countryB);
  if(!a.length || !b.length){ clearBand(); return; }

  const dPath = bandPath(a,b);
  const p = bandG.selectAll("path.between-band").data([dPath]);

  p.enter().append("path")
    .attr("class","between-band")
    .attr("d", dPath)
    .attr("opacity", 0)
    .transition().duration(animate? 600 : 0)
    .attr("opacity", 1);

  p.transition().duration(600).attr("d", dPath);
  p.exit().remove();
}

/* year update */
function updateYear(rowsForYear, prevMap, prevByCountry){
  const newPts = buildPoints(rowsForYear);
  beeswarm(newPts, prevMap);
  points = newPts;

  const t = d3.transition().duration(600).ease(d3.easeCubicInOut);

  dotsG.selectAll("circle").data(points, d=>d.id)
    .join(
      enter => enter.append("circle")
        .attr("r", r).attr("cx", d=>d.x).attr("cy", d=>d.y)
        .attr("class", d => d.Country==="European Union" ? "dot eu-dot" : "dot")
        .attr("fill", d => color(d.value))
        .attr("opacity", selectedCountries.length ? (d => selectedCountries.includes(d.Country) ? 1 : 0.2) : 1),
      update => update, exit => exit.remove()
    )
    .transition(t)
    .attr("cx", d=>d.x).attr("cy", d=>d.y).attr("fill", d => color(d.value))
    .attr("opacity", selectedCountries.length ? (d => selectedCountries.includes(d.Country) ? 1 : 0.2) : 1);

  drawDots();

  if (selectedCountries.length){
    applyFade(new Set(selectedCountries));
    ["A","B"].forEach((slot,i)=>{
      const country = selectedCountries[i];
      if (!country) { clearLayer(layers[slot]); return; }
      const prevPts = prevByCountry && prevByCountry[country];
      const nextPts = getCountryRowPoints(points, country);
      if (prevPts && prevPts.length){
        morphLayer(layers[slot], prevPts, nextPts, slot==="B");
      }else{
        drawLayer(layers[slot], nextPts, slot==="B", false);
      }
      drawLabel(layers[slot].labelG, country, slot==="B" ? -48 : -28);
    });

    if (selectedCountries.length === 2){
      drawBetweenBand(selectedCountries[0], selectedCountries[1], false);
    } else {
      clearBand();
    }
  }else{
    applyFade(new Set());
    clearLayers();
  }
}

/* selection: render */
function renderSelectedLayers(animate){
  applyFade(new Set(selectedCountries));
  const slots = { A: selectedCountries[0] || null, B: selectedCountries[1] || null };

  ["A","B"].forEach((slot,i)=>{
    const country = slots[slot];
    if(!country){ clearLayer(layers[slot]); return; }
    const pts = getCountryRowPoints(points, country);
    drawLayer(layers[slot], pts, slot==="B", animate && slot==="B");
    drawLabel(layers[slot].labelG, country, slot==="B" ? -48 : -28);
  });

  if (selectedCountries.length === 2){
    drawBetweenBand(selectedCountries[0], selectedCountries[1], true);
  } else {
    clearBand();
  }
}

/* layer helpers */
function drawLayer(layer, pts, isSecond=false, animate=false){
  const cls = isSecond ? "second" : "";
  layer.g.selectAll("*").remove();

  const path = layer.g.append("path").attr("class",`highlight ${cls}`).attr("d", lineGen(pts));
  if (animate){
    const L = path.node().getTotalLength();
    path.attr("stroke-dasharray", `${L} ${L}`).attr("stroke-dashoffset", L)
        .transition().duration(1000).ease(d3.easeCubicInOut).attr("stroke-dashoffset", 0);
  }
  layer.g.selectAll(null).data(pts).enter().append("circle")
    .attr("class",`highlight-pin ${cls}`).attr("r", r+2).attr("cx", d=>d.x).attr("cy", d=>d.y).attr("fill","none");
}

function morphLayer(layer, prevPts, nextPts, isSecond=false){
  const cls = isSecond ? "second" : "";
  layer.g.selectAll("*").remove();

  const path = layer.g.append("path").attr("class",`highlight ${cls}`).attr("d", lineGen(prevPts));
  path.transition().duration(600).ease(d3.easeCubicInOut)
    .attrTween("d", function(){
      const n = Math.min(prevPts.length, nextPts.length);
      const I = [];
      for (let i=0;i<n;i++){ I.push({x:d3.interpolateNumber(prevPts[i].x,nextPts[i].x), y:d3.interpolateNumber(prevPts[i].y,nextPts[i].y)}); }
      return t => lineGen(I.map(f=>({x:f.x(t), y:f.y(t)})));
    });

  layer.g.selectAll(null).data(nextPts,(d,i)=>i).enter().append("circle")
    .attr("class",`highlight-pin ${cls}`).attr("r", r+2)
    .attr("cx",(d,i)=>prevPts[i]?prevPts[i].x:d.x).attr("cy",(d,i)=>prevPts[i]?prevPts[i].y:d.y)
    .attr("fill","none").transition().duration(600).ease(d3.easeCubicInOut)
    .attr("cx",d=>d.x).attr("cy",d=>d.y);
}

function drawLabel(labelG, country, yOffset){
  labelG.selectAll("*").remove();
  const firstCat = categories[0];
  const pt = points.find(p=>p.Country===country && p.Metric===firstCat);
  if (!pt) return;

  const label = country==="European Union" ? "European Union" : country;
  const meas = labelG.append("text").attr("font-weight",800).attr("font-size",18).text(label);
  const wText = meas.node().getBBox().width; meas.remove();
  const iso = (FLAG_CODE[country] || "").toLowerCase();
  const wFlag = iso ? 18 : 0, pad = iso ? 6 : 0;
  const total = wFlag + pad + wText;
  const baseX = pt.x - total/2;
  const baseY = rowY(0) + yOffset;

  labelG.append("foreignObject")
    .attr("class","name-fo").attr("x", baseX).attr("y", baseY-12).attr("width", total).attr("height", 26)
    .html(`<div xmlns="http://www.w3.org/1999/xhtml" class="flag-row">
             ${iso ? `<span class="fi fi-${iso}"></span>` : ``}
             <span>${label}</span>
           </div>`);
}

function clearLayer(layer){ layer.g.selectAll("*").remove(); layer.labelG.selectAll("*").remove(); }
function clearLayers(){ clearLayer(layers.A); clearLayer(layers.B); clearBand(); }
</script>
</body>
</html>
