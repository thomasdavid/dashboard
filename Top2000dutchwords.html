<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutch Flashcards</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            padding: 10px;
            box-sizing: border-box;
        }
        
        /* Tooltip & Linking Styles */
        .linked-word {
            text-decoration: underline dotted #3498db;
            cursor: help;
            position: relative;
            color: inherit;
        }

        .linked-word::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            width: 240px;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            line-height: 1.4;
            font-weight: normal;
            text-align: left;
        }

        .linked-word:hover::after {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        /* Info Button & Modal */
        #info-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 100;
        }
        #info-btn:hover { transform: scale(1.1); }
        #info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            position: relative;
            text-align: left;
            line-height: 1.5;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #aaa;
            font-weight: bold;
        }

        /* Flashcard Container */
        #flashcard-container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            min-height: 400px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            transition: transform 0.1s;
            position: relative;
        }
        #flashcard-container:active { transform: scale(0.99); }
        
        .text-audio-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:hover { background-color: #f0f4f8; transform: scale(1.1); }

        .word-audio { font-size: 2rem; padding: 10px; }
        .small-audio { font-size: 1.5rem; padding: 8px; }

        #dutch-word { font-size: 3.5rem; font-weight: bold; color: #2c3e50; margin: 0; }
        #word-type { font-size: 1.2rem; color: #7f8c8d; font-style: italic; margin: 5px 0 15px 0; }
        .sentence-row { margin: 0 0 20px 0; }
        #sentence { font-size: 1.5rem; line-height: 1.4; }
        
        .reveal-box {
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .def-box { background-color: #e8f4f8; border: 1px solid #b3e5fc; }
        #dutch-definition { font-size: 1.3rem; color: #0277bd; text-align: left; flex-grow: 1; }
        .english-box { background-color: #e8f5e9; border: 1px solid #c8e6c9; justify-content: center; }
        #english-word { font-weight: bold; font-size: 1.8rem; color: #2e7d32; }
        
        #controls-container { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-top: 20px; gap: 10px; }
        button.nav-btn { background-color: #3498db; color: white; border: none; padding: 15px 20px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; flex: 1; }
        button.nav-btn:disabled { background-color: #bdc3c7; }
        .status-area { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; margin-top: 15px; gap: 15px; }
        .difficulty-controls { display: flex; width: 100%; gap: 5px; justify-content: center; flex-wrap: wrap; }
        .diff-btn { background-color: #e0e6ed; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; border: 2px solid transparent; }
        .diff-btn.active { background-color: #9b59b6; color: white; border-color: #8e44ad; }
        .hidden { display: none !important; }

        @media (max-width: 600px) {
            #dutch-word { font-size: 2.5rem; }
            #sentence { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <button id="info-btn" title="About this tool">ℹ️</button>

    <div id="info-modal" class="hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>About This Tool</h2>
            <p>Master Dutch vocabulary. Hover over dotted-underlined words to see their linked cards!</p>
        </div>
    </div>

    <div id="loading">Loading words from GitHub...</div>

    <div id="flashcard-container" class="hidden">
        <div class="text-audio-row">
            <div id="dutch-word">Word</div>
            <button id="word-audio-btn" class="audio-btn word-audio">🔊</button>
        </div>
        <div id="word-type">(Type)</div>
        <div class="text-audio-row sentence-row">
            <div id="sentence">Sentence goes here.</div>
            <button id="sentence-audio-btn" class="audio-btn small-audio">🔊</button>
        </div>
        <div id="def-container" class="hidden reveal-box def-box">
            <div id="dutch-definition">Definition</div>
            <button id="def-audio-btn" class="audio-btn small-audio">🔊</button>
        </div>
        <div id="english-container" class="hidden reveal-box english-box">
            <div id="english-word">English</div>
        </div>
    </div>
    
    <div id="controls-container" class="hidden">
        <button id="prev-btn" class="nav-btn">&larr; Prev</button>
        <button id="next-btn" class="nav-btn">Next &rarr;</button>
    </div>
    
    <div class="status-area hidden" id="status-container">
        <div id="progress"></div>
        <div class="difficulty-controls">
            <button class="diff-btn active" data-level="all">All</button>
            <button class="diff-btn" data-level="1">Lvl 1</button>
            <button class="diff-btn" data-level="2">Lvl 2</button>
            <button class="diff-btn" data-level="3">Lvl 3</button>
            <button class="diff-btn" data-level="4">Lvl 4</button>
        </div>
    </div>

    <script>
        const csvUrl = 'https://raw.githubusercontent.com/thomasdavid/dashboard/main/dutchwords.csv';
        let allFlashcards = [];   
        let currentDeck = [];     
        let currentIndex = 0;
        let currentState = 0;     

        const elements = {
            container: document.getElementById('flashcard-container'),
            word: document.getElementById('dutch-word'),
            type: document.getElementById('word-type'),
            sentence: document.getElementById('sentence'),
            definition: document.getElementById('dutch-definition'),
            english: document.getElementById('english-word'),
            defContainer: document.getElementById('def-container'),
            engContainer: document.getElementById('english-container'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            wordAudioBtn: document.getElementById('word-audio-btn'),
            sentenceAudioBtn: document.getElementById('sentence-audio-btn'),
            defAudioBtn: document.getElementById('def-audio-btn'),
            diffBtns: document.querySelectorAll('.diff-btn'),
            loading: document.getElementById('loading'),
            controls: document.getElementById('controls-container'),
            status: document.getElementById('status-container'),
            progress: document.getElementById('progress'),
            infoBtn: document.getElementById('info-btn'),
            infoModal: document.getElementById('info-modal'),
            closeModalBtn: document.getElementById('close-modal')
        };

        elements.infoBtn.onclick = (e) => { e.stopPropagation(); elements.infoModal.classList.remove('hidden'); };
        elements.closeModalBtn.onclick = () => elements.infoModal.classList.add('hidden');

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function calculateDifficulty(index, wordText) {
            let base = 4;
            if (index < 500) base = 1;
            else if (index < 1500) base = 2;
            else if (index < 2500) base = 3;
            let len = wordText.length;
            if (len <= 4) base -= 1;
            else if (len >= 10) base += 1;
            return Math.max(1, Math.min(4, base));
        }

        function playDutchAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'nl-NL';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function parseCSVLine(text) {
            let ret = [], inQuote = false, value = '';
            for (let i = 0; i < text.length; i++) {
                let ch = text[i];
                if (inQuote) {
                    if (ch === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { value += '"'; i++; } 
                        else inQuote = false;
                    } else value += ch;
                } else {
                    if (ch === '"') inQuote = true;
                    else if (ch === ',') { ret.push(value.trim()); value = ''; }
                    else value += ch;
                }
            }
            ret.push(value.trim());
            return ret;
        }

        function enrichText(text) {
            if (!text) return "";
            const parts = text.split(/(\s+|[.,!?;:()"])/);
            
            return parts.map(part => {
                const clean = part.toLowerCase().replace(/[^a-zà-ü]/g, '');
                if (clean.length < 2) return part;
                if (clean === currentDeck[currentIndex].dutch.toLowerCase()) return part;

                const match = allFlashcards.find(c => c.dutch.toLowerCase() === clean);
                if (match) {
                    const tooltip = `Word: ${match.dutch}\nType: ${match.type}\nSentence: ${match.sentence}\nDef: ${match.definition}`;
                    return `<span class="linked-word" data-tooltip="${tooltip}">${part}</span>`;
                }
                return part;
            }).join('');
        }

        async function fetchCSV() {
            try {
                const response = await fetch(csvUrl);
                const textData = await response.text();
                const lines = textData.trim().split('\n');
                let wordCount = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    const columns = parseCSVLine(lines[i]);
                    // Restoring your exact requested indices from original code
                    if (columns.length >= 6) {
                        const dutchWord = columns[1];
                        allFlashcards.push({
                            dutch: dutchWord,
                            sentence: columns[3],
                            type: columns[4],
                            english: columns[5],
                            definition: columns[6] || '',
                            difficulty: calculateDifficulty(wordCount, dutchWord)
                        });
                        wordCount++;
                    }
                }
                
                elements.loading.classList.add('hidden');
                elements.container.classList.remove('hidden');
                elements.controls.classList.remove('hidden');
                elements.status.classList.remove('hidden');
                loadDifficultySet('all');
            } catch (error) { console.error('Error:', error); }
        }

        function loadDifficultySet(level) {
            elements.diffBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.level == level));
            let filtered = (level === 'all') ? [...allFlashcards] : allFlashcards.filter(card => card.difficulty === parseInt(level));
            currentDeck = shuffleArray(filtered);
            currentIndex = 0;
            updateCard();
        }

        function updateCard() {
            if (!currentDeck[currentIndex]) return;
            const card = currentDeck[currentIndex];
            
            elements.word.textContent = card.dutch;
            elements.type.textContent = `(${card.type})`;
            
            elements.sentence.innerHTML = enrichText(card.sentence);
            elements.definition.innerHTML = card.definition ? enrichText(card.definition) : "(No Dutch definition provided)";
            
            elements.english.textContent = card.english;
            elements.defContainer.classList.add('hidden');
            elements.engContainer.classList.add('hidden');
            currentState = 0;
            elements.progress.textContent = `Word ${currentIndex + 1} of ${currentDeck.length} (Lvl ${card.difficulty})`;
            elements.prevBtn.disabled = currentIndex === 0;
            elements.nextBtn.disabled = currentIndex === currentDeck.length - 1;
        }

        function advanceState() {
            if (currentState === 0) { elements.defContainer.classList.remove('hidden'); currentState = 1; } 
            else if (currentState === 1) { elements.engContainer.classList.remove('hidden'); currentState = 2; } 
            else if (currentIndex < currentDeck.length - 1) { currentIndex++; updateCard(); }
        }

        elements.container.onclick = advanceState;
        elements.nextBtn.onclick = (e) => { e.stopPropagation(); if (currentIndex < currentDeck.length - 1) { currentIndex++; updateCard(); } };
        elements.prevBtn.onclick = (e) => { e.stopPropagation(); if (currentIndex > 0) { currentIndex--; updateCard(); } };
        elements.diffBtns.forEach(btn => btn.onclick = () => loadDifficultySet(btn.dataset.level));

        elements.wordAudioBtn.onclick = (e) => { e.stopPropagation(); playDutchAudio(currentDeck[currentIndex].dutch); };
        elements.sentenceAudioBtn.onclick = (e) => { e.stopPropagation(); playDutchAudio(currentDeck[currentIndex].sentence); };
        elements.defAudioBtn.onclick = (e) => { e.stopPropagation(); playDutchAudio(currentDeck[currentIndex].definition); };

        document.onkeydown = (e) => {
            if (e.code === 'Space') { e.preventDefault(); advanceState(); }
            else if (e.code === 'ArrowRight') { if (currentIndex < currentDeck.length - 1) { currentIndex++; updateCard(); } }
            else if (e.code === 'ArrowLeft') { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        };

        fetchCSV();
    </script>
</body>
</html>
