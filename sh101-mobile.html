<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#191a17">
  <title>SH-101 Vibe</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #191a17;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #synth-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: 0;
      display: block;
      background: #191a17;
    }

    #rotate-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: #191a17;
      color: #f2f2ee;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    #rotate-screen button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 18px 24px;
      background: #e8862a;
      color: #111;
      font: 700 16px/1 Arial, Helvetica, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-screen { display: flex; }
      #synth-frame { visibility: hidden; }
    }

    @media (orientation: landscape) {
      #rotate-screen { display: none !important; }
      #synth-frame { visibility: visible; }
    }
  </style>
</head>
<body>
  <iframe
    id="synth-frame"
    src="./sh101vibe2.html"
    title="SH-101 Vibe synthesizer"
    allow="autoplay; fullscreen"
    allowfullscreen
  ></iframe>

  <div id="rotate-screen" aria-live="polite">
    <button id="enter-button" type="button">Rotate to landscape</button>
  </div>

  <script>
    const enterButton = document.getElementById('enter-button');

    async function enterImmersiveMode() {
      try {
        if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (_) {
        // iOS Safari may not expose the standard Fullscreen API.
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (_) {
        // Orientation locking is not available in all mobile browsers.
      }
    }

    enterButton.addEventListener('click', enterImmersiveMode);
    enterButton.addEventListener('touchend', enterImmersiveMode, { passive: true });

    window.addEventListener('orientationchange', () => {
      setTimeout(() => window.scrollTo(0, 0), 100);
    });
  </script>
</body>
</html>
