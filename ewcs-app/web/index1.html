<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EWCS Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/maps/modules/map.js"></script>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<script src="https://code.highcharts.com/modules/offline-exporting.js"></script>
<script src="https://code.highcharts.com/mapdata/custom/europe.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root { --blue: #355582; --grey: #9ca2a9; --border: #d8d8d8; --bg: #ffffff; --text: #333333; --warning: #d32f2f; font-size: 14px; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', Arial, sans-serif; margin: 1.5rem auto; max-width: 1100px; color: var(--text); background: var(--bg); }
  h1 { margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 600; color: var(--blue); }
  .subtitle { color: var(--grey); margin-bottom: 2rem; font-size: 0.9rem; }
  .controls-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; background: #f9fafb; padding: 1.5rem; border-radius: 8px; border: 1px solid #eee; align-items: end; }
  label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: var(--grey); }
  select, input[type="number"] { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 4px; font: inherit; background-color: #fff; }
  select[multiple] { height: 100px; }
  select:focus, input:focus { border-color: var(--blue); outline: none; }
  
  /* Buttons */
  .download-controls { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; align-items: center; justify-content: flex-end; }
  .btn-download { padding: 0.6rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; transition: background 0.2s; }
  .btn-view { background-color: #ffffff; border: 1px solid var(--border); color: var(--text); }
  .btn-view:hover { background-color: #f3f3f3; }
  .btn-full { background-color: var(--blue); border: 1px solid var(--blue); color: white; }
  .btn-full:hover { background-color: #2a4469; }
  .btn-full:disabled { background-color: #9ca2a9; border-color: #9ca2a9; cursor: not-allowed; }

  .toggle-wrapper { display: flex; align-items: center; gap: 10px; padding-bottom: 5px; }
  .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--blue); }
  input:checked + .slider:before { transform: translateX(22px); }
  .mode-label { font-weight: 600; font-size: 0.9rem; color: var(--blue); }
  #tabs { display: flex; gap: 1.5rem; margin: 0 0 1rem; font-weight: 600; border-bottom: 1px solid #eee; }
  .tab { display: flex; align-items: center; gap: 0.4rem; padding-bottom: 0.8rem; color: var(--grey); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .tab.active { color: var(--blue); border-bottom: 3px solid var(--blue); }
  .tab svg { width: 18px; height: 18px; fill: currentColor; }
  #chart-container { width: 100%; min-height: 800px; margin-bottom: 1rem; border: 1px solid #eee; border-radius: 4px; }
  #chart-notes { margin-top: 0.5rem; font-size: 0.85rem; color: var(--warning); line-height: 1.4; }
  #status { margin-top: 1rem; font-size: 0.9rem; color: var(--grey); min-height: 1.5em; }
  #status.error { color: #dc2626; }
  #download-status { font-size: 0.85rem; color: var(--blue); margin-right: auto; }
  footer { margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <h1>EWCS Analytical Dashboard</h1>
  <div class="subtitle">Weighted country profiles · Proportions, Indices, and Trends</div>

  <div id="tabs">
    <span class="tab active" data-view="bar"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="6" height="12"/><rect x="10" y="3" width="6" height="18"/><rect x="17" y="13" width="6" height="8"/></svg> Chart View</span>
    <span class="tab" data-view="map"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg> Map View</span>
    <span class="tab" data-view="trend"><svg viewBox="0 0 24 24"><path d="M16,11.78L20.24,4.45L21.97,5.45L16.74,14.5L10.23,10.75L5.46,19H22V21H2V3H4V17.54L9.5,8L16,11.78Z"/></svg> Trend</span>
  </div>

  <div id="std-controls" class="controls-row">
    <div><label>1. Select Survey</label><select id="survey-select"><option value="">Loading...</option></select></div>
    <div><label>Filter Category</label><select id="category-select"><option value="">None (All)</option></select></div>
    <div><label>2. Select Question</label><select id="question-select"><option value="">Select a survey first...</option></select></div>
    <div><label>3. Select Weight</label><select id="weight-select"><option value="">Select a survey first...</option></select></div>
    <div id="mode-toggle-box">
        <label>Display Mode</label>
        <div class="toggle-wrapper"><label class="switch"><input type="checkbox" id="mode-toggle"><span class="slider"></span></label><span id="mode-label" class="mode-label">Proportions</span></div>
    </div>
    <div><label for="threshold-input">Low Base Threshold</label><input type="number" id="threshold-input" value="300" min="0" step="50"></div>
  </div>

  <div id="trend-controls" class="controls-row hidden">
    <div><label>1. Select Question</label><select id="t-question-select"><option value="">Loading...</option></select></div>
    <div><label>Filter Category</label><select id="t-category-select"><option value="">None (All)</option></select></div>
    <div><label>2. Select Weight</label><select id="t-weight-select"><option value="">Select...</option></select></div>
    <div><label>3. Response (Multi)</label><select id="t-response-select" multiple><option value="">Select Question first...</option></select></div>
    <div><label>4. Country (Multi)</label><select id="t-country-select" multiple><option value="">Loading...</option></select></div>
    <div><label for="t-threshold-input">Low Base Threshold</label><input type="number" id="t-threshold-input" value="300" min="0" step="50"></div>
  </div>

  <div id="map-controls" class="controls-row hidden" style="padding: 1rem; margin-bottom: 1rem;">
    <div><label>Select Response(s) (Multi)</label><select id="response-select" multiple></select></div>
  </div>

  <div class="download-controls">
      <span id="download-status"></span>
      <button class="btn-download btn-view" onclick="downloadCurrentView()"><span>📊</span> Download View (CSV)</button>
      <button class="btn-download btn-full" id="btn-download-full" onclick="downloadFullDataset()"><span>📥</span> Download Full Dataset</button>
  </div>

  <div id="status"></div>
  <div id="chart-container"></div>
  <div id="chart-notes"></div>

  <footer><img src="https://raw.githubusercontent.com/thomasdavid/dashboard/main/logo.svg" alt="Eurofound" style="height:30px;opacity:0.8"></footer>

<script>
  const API_BASE = ""; 
  const DEFAULT_WEIGHT = "w4";
  const ECS_DEFAULT_WEIGHT = "emp_wei";
  const TREND_DEFAULT_Q = "Job Satisfaction"; 
  const TREND_DEFAULT_RESPS = ["Very satisfied", "Satisfied"];

  // --- UPDATED CATEGORY MAPPINGS (Fixed 35:54 and ISCO_1) ---
  const CATEGORY_DEF = {
    // --- Old EWCS ---
    "agesex": [
        {label: "Male 15-24", value: "1"}, {label: "Male 25-54", value: "2"}, {label: "Male 55+", value: "3"},
        {label: "Female 15-24", value: "4"}, {label: "Female 25-54", value: "5"}, {label: "Female 55+", value: "6"}
    ],
    "isco": [{label: "Managers", value: "1"}, {label: "Professionals", value: "2"}, {label: "Technicians", value: "3"}, {label: "Clerks", value: "4"}, {label: "Service/Sales", value: "5"}, {label: "Skilled Agric", value: "6"}, {label: "Craft/Trades", value: "7"}, {label: "Plant/Machine", value: "8"}, {label: "Elementary", value: "9"}, {label: "Armed Forces", value: "10"}],
    "sector2": [{label: "Prod/Ind", value: "1"}, {label: "Services", value: "2"}],
    "sector13": [{label: "Sector 1", value: "1"}, {label: "Sector 2", value: "2"}, {label: "Sector 3", value: "3"}, {label: "Sector 4", value: "4"}],
    "size_5": [{label: "10-19", value: "1"}, {label: "20-49", value: "2"}, {label: "50-249", value: "3"}, {label: "250-499", value: "4"}, {label: "500+", value: "5"}],
    "size_10": [{label: "Size 1", value: "1"}, {label: "Size 2", value: "2"}],
    "mm102grp": [{label: "Size Grp 1", value: "1"}, {label: "Size Grp 2", value: "2"}],

    // --- NEW: EWCS 2024 (EWCSR8) ---
    "sex2": [{label: "Male", value: "1"}, {label: "Female", value: "2"}],
    
    // AGE: Value set to "35:54:00" to match weird DB string
    "age3": [
        {label: "16-34", value: "16-34"}, 
        {label: "35-54", value: "35:54"}, // <--- Fixed to "35:54"
        {label: "55+", value: "55+"}
    ],
    
    "bdwn_NACE0_lbl": [
        {label: "Agriculture", value: "Agriculture"}, {label: "Industry", value: "Industry"}, {label: "Construction", value: "Construction"}, 
        {label: "Commerce & hospitality", value: "Commerce & hospitality"}, {label: "Transport", value: "Transport"}, {label: "Financial services", value: "Financial services"}, 
        {label: "Public administration", value: "Public administration"}, {label: "Education", value: "Education"}, {label: "Health", value: "Health"}, {label: "Other services", value: "Other services"}
    ],
    // ISCO_1: Using clean Numeric Column
    "ISCO_1": [
        {label: "1. Managers", value: "1"}, {label: "2. Professionals", value: "2"}, {label: "3. Technicians", value: "3"}, {label: "4. Clerks", value: "4"}, 
        {label: "5. Service/Sales", value: "5"}, {label: "6. Skilled Agric", value: "6"}, {label: "7. Craft/Trades", value: "7"}, {label: "8. Plant/Machine", value: "8"}, 
        {label: "9. Elementary", value: "9"}, {label: "0. Armed Forces", value: "0"}
    ],
    "bdwn_wstatus": [
        {label: "1. Self-employed (Own account)", value: "1"}, {label: "2. Self-employed (With employees)", value: "2"}, {label: "3. Employee (Fixed/Temp)", value: "3"}, 
        {label: "4. Employee (Indefinite)", value: "4"}, {label: "5. Employee (Other)", value: "5"}
    ],
    "part_time": [{label: "Full-time", value: "1"}, {label: "Part-time", value: "2"}]
  };
  
  function interpolateColor(color1, color2, factor) { if (arguments.length < 3) factor = 0.5; var r1 = parseInt(color1.substring(1, 3), 16), g1 = parseInt(color1.substring(3, 5), 16), b1 = parseInt(color1.substring(5, 7), 16), r2 = parseInt(color2.substring(1, 3), 16), g2 = parseInt(color2.substring(3, 5), 16), b2 = parseInt(color2.substring(5, 7), 16); return "#" + ((1 << 24) + (Math.round(r1 + factor * (r2 - r1)) << 16) + (Math.round(g1 + factor * (g2 - g1)) << 8) + Math.round(b1 + factor * (b2 - b1))).toString(16).slice(1); }
  function generateDivergingPalette(n) { const blues = ["#355582", "#5F7CA6", "#A0B3CA"], greens = ["#005F2F", "#559E55", "#A0DCA0"], grey = "#D3D3D3", colors = [], mid = Math.floor(n / 2), isOdd = n % 2 !== 0; for (let i = 0; i < mid; i++) colors.push(blues[Math.min(i, blues.length - 1)]); if (isOdd) colors.push(grey); const rightSide = []; for (let i = 0; i < mid; i++) rightSide.push(greens[Math.min(i, greens.length - 1)]); colors.push(...rightSide.reverse()); return colors; }

  const els = {
    survey: document.getElementById('survey-select'), question: document.getElementById('question-select'),
    weight: document.getElementById('weight-select'), response: document.getElementById('response-select'),
    category: document.getElementById('category-select'), modeToggle: document.getElementById('mode-toggle'),
    modeLabel: document.getElementById('mode-label'), stdControls: document.getElementById('std-controls'),
    trendControls: document.getElementById('trend-controls'), mapControls: document.getElementById('map-controls'),
    tQuestion: document.getElementById('t-question-select'), tWeight: document.getElementById('t-weight-select'),
    tResponse: document.getElementById('t-response-select'), tCountry: document.getElementById('t-country-select'),
    tCategory: document.getElementById('t-category-select'), status: document.getElementById('status'),
    notes: document.getElementById('chart-notes'), tabs: document.querySelectorAll('.tab'), container: 'chart-container',
    threshold: document.getElementById('threshold-input'), tThreshold: document.getElementById('t-threshold-input')
  };

  let currentData = [], currentView = 'bar', chartMode = 'proportion', trendInitDone = false, lastTrendData = null, lastTrendLabel = "";

  function setStatus(msg, isError = false) { els.status.textContent = msg; els.status.className = isError ? 'error' : ''; }
  async function fetchJson(url) { const r = await fetch(url); if(!r.ok) throw new Error(r.statusText); return await r.json(); }
  
  function getCountryKey(name) {
    if (!name) return null; const n = name.trim(); if (/^[a-zA-Z]{2}$/.test(n)) return n.toLowerCase();
    const isoMap = {"Albania": "al", "Austria": "at", "Belgium": "be", "Bulgaria": "bg", "Croatia": "hr", "Cyprus": "cy", "Czech Republic": "cz", "Czechia": "cz", "Denmark": "dk", "Estonia": "ee", "Finland": "fi", "France": "fr", "Germany": "de", "Greece": "gr", "Hungary": "hu", "Ireland": "ie", "Italy": "it", "Latvia": "lv", "Lithuania": "lt", "Luxembourg": "lu", "Malta": "mt", "Netherlands": "nl", "Poland": "pl", "Portugal": "pt", "Romania": "ro", "Slovakia": "sk", "Slovenia": "si", "Spain": "es", "Sweden": "se", "United Kingdom": "gb", "Turkey": "tr"};
    return isoMap[n] || n.substring(0, 2).toLowerCase();
  }

  function computeIndex(rows) {
    const byC = {}; rows.forEach(r => { if(!byC[r.country_label]) byC[r.country_label]=[]; byC[r.country_label].push(r); });
    const out = [];
    for(const [c, arr] of Object.entries(byC)) {
      let sumProd=0, sumW=0; arr.forEach(r => { const v=parseFloat(r.value); if(!isNaN(v)){ sumProd+=v*r.pct; sumW+=r.pct; } });
      if(sumW>0) out.push({ country_label:c, index:sumProd/sumW, total_count: arr[0].total_count });
    }
    return out;
  }

  async function updateCategories(surveyId, dropdown) {
    dropdown.innerHTML = '<option value="">None (All)</option>';
    try {
        const cats = await fetchJson(`${API_BASE}/categories/${surveyId}`);
        cats.forEach(c => {
            const defs = CATEGORY_DEF[c.id];
            if (defs) {
                const grp = document.createElement('optgroup'); grp.label = c.id.toUpperCase();
                defs.forEach(d => { const opt = document.createElement('option'); opt.textContent = d.label; opt.value = `${c.id}:${d.value}`; grp.appendChild(opt); });
                dropdown.appendChild(grp);
            }
        });
    } catch(e) { console.log(e); }
  }

  async function init() {
    try {
      const data = await fetchJson(`${API_BASE}/surveys`);
      els.survey.innerHTML = '<option value="">Select...</option>' + data.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
      setStatus("Ready.");
    } catch(e) { setStatus("API Error", true); }
  }

  els.survey.addEventListener('change', async () => {
    if(!els.survey.value) return;
    setStatus("Loading...");
    await updateCategories(els.survey.value, els.category);
    const [qs, ws] = await Promise.all([fetchJson(`${API_BASE}/questions/${els.survey.value}`), fetchJson(`${API_BASE}/weights/${els.survey.value}`)]);
    els.question.innerHTML = '<option value="">Select...</option>';
    qs.forEach(q => { const opt = document.createElement('option'); opt.value = q.id; opt.textContent = q.label; opt.dataset.desc = q.description||q.label; els.question.appendChild(opt); });
    els.weight.innerHTML = '<option value="">Select...</option>' + ws.map(w=>`<option value="${w.id}">${w.label}</option>`).join('');
    let defW = DEFAULT_WEIGHT; if (els.survey.value.startsWith('ECSR')) defW = ECS_DEFAULT_WEIGHT; if (els.survey.value === 'EWCSR8') defW = "calweight"; 
    if(ws.some(w=>w.id===defW)) els.weight.value=defW; else if(ws.length>0) els.weight.selectedIndex=1;
    setStatus("Select question.");
  });

  const loadStdData = async () => {
    if (!els.survey.value || !els.question.value || !els.weight.value) return;
    setStatus("Fetching...");
    let url = `${API_BASE}/weighted?survey=${els.survey.value}&question=${encodeURIComponent(els.question.value)}&weight=${els.weight.value}`;
    const catVal = els.category.value; if (catVal) { const [grp, val] = catVal.split(':'); url += `&category_group=${grp}&category_value=${encodeURIComponent(val)}`; }
    const resp = await fetchJson(url); currentData = resp.rows || []; updateResponseDropdown(); renderChart(); setStatus("");
  };

  function updateResponseDropdown() {
    const resps = [...new Set(currentData.map(r=>r.value_label))].sort(); els.response.innerHTML = "";
    resps.forEach((r, index) => { const opt = document.createElement("option"); opt.value = r; opt.textContent = r; if (currentView === 'map' && index === 0) opt.selected = true; else if (currentView!=='map') opt.selected = true; els.response.appendChild(opt); });
  }

  els.question.addEventListener('change', loadStdData); els.weight.addEventListener('change', loadStdData);
  els.category.addEventListener('change', loadStdData); els.response.addEventListener('change', () => { if(currentView==='map') renderChart(); });
  els.modeToggle.addEventListener('change', () => { chartMode = els.modeToggle.checked ? 'index' : 'proportion'; els.modeLabel.textContent = chartMode==='index'?'Index':'Proportions'; renderChart(); });
  els.threshold.addEventListener('change', renderChart);

  async function initTrend() { if(trendInitDone) return; trendInitDone = true; const qs = await fetchJson(`${API_BASE}/questions/longitudinal`); els.tQuestion.innerHTML = '<option value="">Select...</option>' + qs.map(q=>`<option value="${q.id}">${q.label}</option>`).join(''); const ws = await fetchJson(`${API_BASE}/weights/EWCSR4`); els.tWeight.innerHTML = '<option value="">Select...</option>' + ws.map(w=>`<option value="${w.id}">${w.label}</option>`).join(''); if(ws.some(w=>w.id===DEFAULT_WEIGHT)) els.tWeight.value=DEFAULT_WEIGHT; await updateCategories("EWCSR4", els.tCategory); }
  
  function checkLowBase(countries, getDataFn, thresholdInput) {
    const limit = parseInt(thresholdInput.value) || 300; const low = [];
    countries.forEach(c => { const d = getDataFn(c); if (d && d.total_count < limit) low.push(`${c} (N=${d.total_count})`); });
    els.notes.innerHTML = low.length ? `<b>Note:</b> Low base size (<${limit}): ${low.join(', ')}.` : "";
  }

  function renderChart() { if(currentView==='bar') chartMode==='index'?drawIndex():drawBar(); else if(currentView==='map') drawMap(); }
  function getTitle() { return els.question.options[els.question.selectedIndex]?.dataset.desc || ""; }

  // DOWNLOAD BUTTONS
  function downloadCurrentView() { const chart = Highcharts.charts[0]; if (chart) chart.downloadCSV(); else alert("No chart."); }
  async function downloadFullDataset() {
      const survey = els.survey.value; if (!survey) { alert("Select a survey."); return; }
      const btn = document.getElementById('btn-download-full'); const st = document.getElementById('download-status');
      btn.disabled = true; st.innerText = `Preparing bulk export for ${survey}...`;
      try {
          const url = `${API_BASE}/api/export_full?survey=${survey}`; 
          const response = await fetch(url); if (!response.ok) throw new Error(response.statusText);
          const blob = await response.blob(); const u = window.URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = u; a.download = `${survey}_Full_Data.csv`; document.body.appendChild(a); a.click(); a.remove();
          st.innerText = "Done!"; setTimeout(() => st.innerText = "", 5000);
      } catch (e) { console.error(e); st.innerText = "Error."; alert("Failed: " + e.message); } finally { btn.disabled = false; }
  }

  function drawBar() {
    els.mapControls.classList.add('hidden');
    const countries = [...new Set(currentData.map(r=>r.country_label))].sort((a,b) => {
        if (a === "EU27") return -1;
        if (b === "EU27") return 1;
        return a.localeCompare(b);
    });
    const answers = [...new Set(currentData.map(r=>r.value_label))];
    checkLowBase(countries, c => currentData.find(r => r.country_label === c), els.threshold);
    const colors = generateDivergingPalette(answers.length);
    
    Highcharts.chart(els.container, {
      chart: { type: 'bar', height: Math.max(800, countries.length * 40) },
      exporting: { enabled: true, csv: { itemDelimiter: ',' } }, // Improved Export
      title: { text: getTitle() }, xAxis: { categories: countries }, yAxis: { title: { text: '%' } },
      legend: { reversed: true },
      plotOptions: { 
          series: { 
              stacking: 'normal', groupPadding: 0.1, pointPadding: 0.15, 
              dataLabels: {
                  enabled: true, color: '#FFFFFF', align: 'right', inside: true, allowOverlap: true, crop: false, overflow: 'allow',
                  style: { textOutline: 'none', fontSize: '11px', fontWeight: 'bold' },
                  formatter: function() { if (this.y <= 0) return null; return parseFloat(this.y.toFixed(1)); }
              }
          } 
      },
      series: answers.map((ans, i) => ({ name: ans, color: colors[i%colors.length], data: countries.map(c => { const r = currentData.find(x=>x.country_label===c && x.value_label===ans); return r ? { y:r.pct, count:r.count, total_count:r.total_count } : null; }) })),
      credits: { enabled: false }
    });
  }

  function drawIndex() {
    els.mapControls.classList.add('hidden');
    const data = computeIndex(currentData).sort((a,b)=>b.index-a.index);
    checkLowBase(data.map(d=>d.country_label), c=>data.find(d=>d.country_label===c), els.threshold);
    Highcharts.chart(els.container, {
      chart: { type: 'column', height: 600 }, exporting: { enabled: true },
      title: { text: getTitle() + " (Index)" }, xAxis: { categories: data.map(d=>d.country_label) }, yAxis: { title: { text: 'Mean' } },
      series: [{ name: 'Index', color: '#355582', data: data.map(d => ({ y: d.index, total_count: d.total_count })), dataLabels: { enabled: true, format: '{y:.1f}' } }],
      credits: { enabled: false }
    });
  }

  function drawMap() {
    els.mapControls.classList.remove('hidden');
    let data = [], subtitle = "";
    if(chartMode==='index') {
      const idx = computeIndex(currentData);
      data = idx.map(r => ({ 'hc-key': getCountryKey(r.country_label), value: r.index, name: r.country_label, total_count: r.total_count }));
      subtitle = "Index (Weighted Mean)";
      checkLowBase(idx.map(r=>r.country_label), c=>idx.find(r=>r.country_label===c), els.threshold);
    } else {
      const sel = Array.from(els.response.selectedOptions).map(o=>o.value);
      const countries = [...new Set(currentData.map(r=>r.country_label))];
      data = countries.map(c => {
        if (c === "EU27") return null; 
        const rows = currentData.filter(r => r.country_label === c && sel.includes(r.value_label));
        const total = rows.reduce((s, r) => s + r.pct, 0);
        return { 'hc-key': getCountryKey(c), value: parseFloat(total.toFixed(1)), name: c, total_count: rows[0]?.total_count||0 };
      }).filter(x => x);
      subtitle = `Responses: ${sel.join(", ")}`;
      checkLowBase(countries.filter(c=>c!=="EU27"), c=>data.find(d=>d.name===c), els.threshold);
    }
    Highcharts.mapChart(els.container, {
      chart: { map: 'custom/europe' }, exporting: { enabled: true }, title: { text: getTitle() }, subtitle: { text: subtitle }, mapNavigation: { enabled: true },
      colorAxis: { min: Math.min(...data.map(d=>d.value)), max: Math.max(...data.map(d=>d.value)), stops: [[0,'#EFEFFF'],[0.5,'#355582'],[1,'#005F2F']] },
      series: [{ data, name: 'Value', states: { hover: { color: '#BADA55' } } }], credits: { enabled: false }
    });
  }

  function drawTrendChart(data, label) {
    const countries = [...new Set(data.map(d=>d.country))].sort();
    const years = [...new Set(data.map(d=>d.year))].sort();
    const limit = parseInt(els.tThreshold.value) || 300;
    const lowPoints = data.filter(d => d.total_count < limit);
    if(lowPoints.length) {
      const lowCs = [...new Set(lowPoints.map(d=>`${d.country} (${d.year})`))];
      els.notes.innerHTML = `<b>Note:</b> Low base size (<${limit}): ${lowCs.join(', ')}.`;
    } else els.notes.innerHTML = "";
    
    Highcharts.chart(els.container, {
      title: { text: els.tQuestion.options[els.tQuestion.selectedIndex].text }, subtitle: { text: `Trend: ${label}` }, xAxis: { categories: years }, yAxis: { title: { text: '%' }, min: 0, max: 100 },
      tooltip: { pointFormatter: function() { return `<span style="color:${this.color}">\u25CF</span> <b>${this.series.name}</b>: ${this.y.toFixed(1)}%<br/>(N=${this.count}, Total=${this.total_count})<br/>`; } },
      series: countries.map(c => ({ name: c, data: years.map(y => { const d = data.find(x => x.country === c && x.year === y); return d ? { y: parseFloat(d.value.toFixed(1)), count: d.count, total_count: d.total_count } : null; }) })),
      credits: { enabled: false }
    });
  }

  function setView(v) {
    currentView = v;
    els.tabs.forEach(t => t.classList.toggle('active', t.dataset.view === v));
    els.stdControls.classList.toggle('hidden', v === 'trend'); els.trendControls.classList.toggle('hidden', v !== 'trend'); els.mapControls.classList.toggle('hidden', v !== 'map');
    if(v === 'trend') initTrend(); else { if(v === 'map' && els.response.options.length > 1) Array.from(els.response.options).forEach((o, i) => o.selected = (i === 0)); renderChart(); }
  }
  els.tabs.forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
  init();
</script>
</body>
</html>
