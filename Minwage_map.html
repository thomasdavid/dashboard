<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Minimum wages and inflation in Europe since 2015</title>
<style>
  :root{
    --gap:10px;
    --tile-w:118px;
    --tile-h:92px;

    /* defaults (overridden per tab by JS) */
    --line:#0B3D56;                /* wage line */
    --fill:rgba(11,61,86,.16);     /* wage area shading */
  }
  html,body{height:100%}
  body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff}

  h2{max-width:1280px;margin:16px auto 6px;padding:0 10px}

  .toolbar{max-width:1280px;margin:0 auto 6px;padding:0 10px;display:flex;gap:8px}
  .btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
  .btn.active{background:#111827;color:#fff;border-color:#111827}

  .canvas{width:min(1280px,98vw);margin:8px auto 24px;position:relative;padding:10px;box-sizing:border-box;}

  .card{position:absolute;width:var(--tile-w);height:var(--tile-h);box-sizing:border-box;transition:opacity .12s ease-in-out;}
  .faded{opacity:.50 !important;}

  .flagline{display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
  .flagline img{
    width:18px;height:12px;object-fit:cover;border-radius:2px;
    background:#fff; /* fills transparent pixels */
    box-shadow:0 0 0 1px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.10); /* subtle halo */
  }

  svg.tiny{display:block;width:100%;height:auto}
  .tickLabel{font-size:9px; fill:#9a9a9a}

  /* keep non-interactive areas clickable through */
  path.area, path.between{ pointer-events:none; opacity:1; }

  .tooltip{
    position:absolute; left:14px; top:20px; z-index:3;
    background:transparent; border:none; border-radius:0; box-shadow:none;
    display:none; pointer-events:none;
    transform: scale(1.4); transform-origin: top left; /* 40% larger */
  }
  .tt-wrap{display:flex;flex-direction:column;gap:6px}
  .tt-row{display:flex;align-items:center;gap:8px}
  .tt-flag{width:30px;height:20px;object-fit:cover;border-radius:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.12);}
  .tt-country{font-weight:600;font-size:14px;color:#111}
  .tt-year{font-weight:800;font-size:18px;color:#222}
  .tt-value{font-weight:900;font-size:34px;color:#000;line-height:1.05}
  .tt-sub{font-weight:700;font-size:15px;color:#111}

  /* Combination tooltip: smaller lines + bar swatches */
  .tooltip.combo .tt-value,
  .tooltip.combo .tt-sub{
    font-size:13px; font-weight:800; line-height:1.25;
    display:flex; align-items:center; gap:.5rem;
  }
  .swatch{
    display:inline-block; width:22px; height:4px; border-radius:2px;
    vertical-align:middle; box-shadow:0 0 0 1px rgba(0,0,0,.15)
  }
  .swatch.infl{background:#C35A08}
  .swatch.reb{background:#0B3D56}
</style>
</head>
<body>
  <h2>Minimum wages and inflation in Europe since 2015</h2>

  <div class="toolbar">
    <button id="btnWage"      class="btn active">Minimum wage</button>
    <button id="btnInflation" class="btn">Inflation (2015=100)</button>
    <button id="btnCombo"     class="btn">Combination</button>
  </div>

<div class="canvas" id="grid">
  <div id="tooltip" class="tooltip" aria-live="polite">
    <div class="tt-wrap">
      <div class="tt-row">
        <img id="tt-flag" class="tt-flag" alt="">
        <div id="tt-country" class="tt-country"></div>
      </div>
      <div id="tt-year" class="tt-year"></div>
      <div id="tt-value" class="tt-value"></div>
      <div id="tt-sub" class="tt-sub"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
/* ===== Robust type names from CSV (case-insensitive contains) ===== */
const TYPE_KEYS = {
  wage:   null, // will be detected
  infl:   null,
  reb:    null
};
const TYPES_UI = {
  wage: 'Minimum wage',
  infl: 'Inflation (2015=100)',
  combo: 'Combination'
};
let currentType = 'wage'; // internal key, not CSV string

/* ===== Data structures ===== */
let columns = []; // month labels kept after Jan 2015 filter
const dataByType = new Map(); // Map(csvTypeString -> Map(country -> series))
const maxByType  = new Map(); // Map(csvTypeString -> global max)

/* ===== EU grid positions ===== */
const gridMap = [
  {code:"SE",name:"Sweden",row:-1,col:4},{code:"FI",name:"Finland",row:-1,col:5},
  {code:"DK",name:"Denmark",row:0,col:3},{code:"EE",name:"Estonia",row:0,col:6},
  {code:"IE",name:"Ireland",row:1,col:0},{code:"NL",name:"Netherlands",row:1,col:2},
  {code:"DE",name:"Germany",row:1,col:3},{code:"PL",name:"Poland",row:1,col:4},
  {code:"LT",name:"Lithuania",row:1,col:5},{code:"LV",name:"Latvia",row:1,col:6},
  {code:"BE",name:"Belgium",row:2,col:2},{code:"LU",name:"Luxembourg",row:2,col:3},
  {code:"CZ",name:"Czechia",row:2,col:4},{code:"SK",name:"Slovakia",row:2,col:5},
  {code:"FR",name:"France",row:3,col:2},{code:"AT",name:"Austria",row:3,col:4},
  {code:"HU",name:"Hungary",row:3,col:5},{code:"RO",name:"Romania",row:3,col:6},
  {code:"PT",name:"Portugal",row:4,col:0},{code:"ES",name:"Spain",row:4,col:1},
  {code:"IT",name:"Italy",row:4,col:3},{code:"SI",name:"Slovenia",row:4,col:4},
  {code:"HR",name:"Croatia",row:4,col:5},{code:"BG",name:"Bulgaria",row:4,col:6},
  {code:"EL",name:"Greece",row:4,col:7},{code:"MT",name:"Malta",row:5,col:3},
  {code:"CY",name:"Cyprus",row:5,col:7}
];

/* ===== Layout helpers ===== */
const TOP_BUFFER_ROWS = 1;
const get = k => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(k));
const gap = () => get('--gap'), w=()=>get('--tile-w'), h=()=>get('--tile-h');
const cellPos = (row,col)=>({left:gap()+col*(w()+gap()), top:gap()+(row+TOP_BUFFER_ROWS)*(h()+gap())});

const gridEl = document.getElementById('grid');
(function sizeCanvas(){
  const maxRow = Math.max(...gridMap.map(d=>d.row));
  const maxCol = Math.max(...gridMap.map(d=>d.col));
  gridEl.style.minWidth  = gap()+(maxCol+1)*(w()+gap())+gap()+'px';
  gridEl.style.minHeight = gap()+(maxRow+1+TOP_BUFFER_ROWS)*(h()+gap())+gap()+'px';
})();

/* ===== Tooltip ===== */
const tooltip=document.getElementById('tooltip');
const ttFlag=document.getElementById('tt-flag');
const ttCountry=document.getElementById('tt-country');
const ttYear=document.getElementById('tt-year');
const ttValue=document.getElementById('tt-value');
const ttSub=document.getElementById('tt-sub');

function showTooltip(){ tooltip.style.display='block'; }
function hideTooltip(){ tooltip.style.display='none'; ttFlag.src=''; ttCountry.textContent=''; ttYear.textContent=''; ttValue.textContent=''; ttSub.textContent=''; tooltip.classList.remove('combo'); }

function updateTooltipSingle(code,name,label,value,isWage){
  const iso=code.toLowerCase();
  let src=`https://flagcdn.com/w20/${iso}.png`;
  if(iso==='el')src='https://flagcdn.com/w20/gr.png';
  if(iso==='gr')src='https://flagcdn.com/w20/el.png';
  ttFlag.src=src; ttFlag.alt=`${name} flag`;
  ttCountry.textContent=name;
  ttYear.textContent=String(label);

  const formatted = (value==null||isNaN(value)) ? '—'
    : new Intl.NumberFormat('en-GB',{maximumFractionDigits:0}).format(value);

  ttValue.textContent = isWage ? (formatted + ' €') : formatted;
  ttSub.textContent = '';
  tooltip.classList.remove('combo');
}

const swatch = (cls) => `<span class="swatch ${cls}"></span>`;

function updateTooltipCombo(code,name,label,inflVal,rebVal){
  const iso=code.toLowerCase();
  let src=`https://flagcdn.com/w20/${iso}.png`;
  if(iso==='el')src='https://flagcdn.com/w20/gr.png';
  if(iso==='gr')src='https://flagcdn.com/w20/el.png';
  ttFlag.src=src; ttFlag.alt=`${name} flag`;
  ttCountry.textContent=name;
  ttYear.textContent=String(label);

  const fmt = v => (v==null||isNaN(v)) ? '—' :
    new Intl.NumberFormat('en-GB',{maximumFractionDigits:0}).format(v);

  ttValue.innerHTML = `${swatch('infl')}Inflation index: ${fmt(inflVal)}`;
  ttSub.innerHTML   = `${swatch('reb')}Minimum wage index: ${fmt(rebVal)}`;
  tooltip.classList.add('combo');
}

/* ===== Fade & sticky ===== */
let sticky=false, stickyCard=null, stickyIdx=null;
const POINT_TOL=9;
function focusOnly(cardEl){ d3.selectAll('.card').classed('faded', true); d3.select(cardEl).classed('faded', false); }
function clearFocus(){ d3.selectAll('.card').classed('faded', false); }
function hideAllDots(){ d3.selectAll('.hover-dot').style('display','none'); }
function clearSticky(){ sticky=false; stickyCard=null; stickyIdx=null; clearFocus(); hideTooltip(); hideAllDots(); }

/* ===== Build tiles (headers) ===== */
const layer=d3.select('#grid');
const cards=layer.selectAll('.card').data(gridMap,d=>d.code).enter().append('div')
  .attr('class','card')
  .style('left',d=>cellPos(d.row,d.col).left+'px')
  .style('top', d=>cellPos(d.row,d.col).top +'px');

cards.each(function(d){
  const iso=d.code.toLowerCase();
  const header=d3.select(this).append('div').attr('class','flagline');
  header.append('img')
    .attr('alt', d.name + ' flag')
    .attr('loading','lazy')
    .attr('src', `https://flagcdn.com/w20/${iso}.png`)
    .on('error', function(){ if(iso==='el') this.src='https://flagcdn.com/w20/gr.png'; if(iso==='gr') this.src='https://flagcdn.com/w20/el.png'; });
});

/* ===== CSV load (filter to Jan 2015+) ===== */
const RAW_CSV = "https://raw.githubusercontent.com/thomasdavid/dashboard/main/minwage.csv";
const CUTOFF = new Date(2015, 0, 1);
function parseMonthLabel(lbl){
  const s = String(lbl).trim();
  const mm = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  let m = s.match(/^([A-Za-z]{3,})(?:[a-z]+)?\s+(\d{2,4})$/);
  if(m){ const month = mm[m[1].slice(0,3).toLowerCase()]; let year = +m[2]; if(year<100) year += 2000; return new Date(year, month, 1); }
  m = s.match(/^(\d{4})[-/](\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, 1);
  return null;
}

d3.csv(RAW_CSV).then(raw=>{
  columns = raw.columns
    .filter(c => c !== "Country" && c !== "Type")
    .filter(lbl => { const d = parseMonthLabel(lbl); return d && d >= CUTOFF; });

  // Discover CSV "Type" labels robustly
  const uniqueTypes = [...new Set(raw.map(r => String(r.Type || '').trim()))];
  const norm = s => s.toLowerCase();
  TYPE_KEYS.wage = uniqueTypes.find(t => norm(t).includes('minimum') && norm(t).includes('wage')) || uniqueTypes[0];
  TYPE_KEYS.infl = uniqueTypes.find(t => norm(t).includes('inflation')) || uniqueTypes[0];
  TYPE_KEYS.reb  = uniqueTypes.find(t => norm(t).includes('rebased')) || null; // may be missing

  // prepare maps for each present type
  uniqueTypes.forEach(t => dataByType.set(t, new Map()));

  raw.forEach(row=>{
    const type=row.Type, name=row.Country;
    const arr = columns.map(lbl=>{
      const v=row[lbl];
      const val = (v==='-'||v===''||v==null) ? null : +v;
      return {year: lbl, value: val};
    });
    dataByType.get(type).set(name, arr);
  });

  // global max per type (for wage/inflation tabs)
  dataByType.forEach((map,type)=>{
    let m=0;
    map.forEach(arr=>arr.forEach(p=>{ if(p.value!=null && p.value>m) m=p.value; }));
    maxByType.set(type, m>0?m:1);
  });

  initCharts();
});

/* Helpers to fetch series by internal key */
function getSeriesByKey(key, countryName){
  const typeStr =
    key==='wage' ? TYPE_KEYS.wage :
    key==='infl' ? TYPE_KEYS.infl : TYPE_KEYS.reb;
  if(!typeStr) return columns.map(lbl=>({year:lbl,value:null}));
  const m = dataByType.get(typeStr);
  return m?.get(countryName) || columns.map(lbl=>({year:lbl,value:null}));
}
function getSeriesAll(countryName){
  const infl = getSeriesByKey('infl', countryName);
  const reb  = getSeriesByKey('reb',  countryName);
  const wage = getSeriesByKey('wage', countryName);
  return { infl, reb, wage };
}

/* ===== Charts ===== */
let x,y,line,area;
const Wsvg=w(), Hsvg=h()-22, M={t:4,r:6,b:14,l:6};
const innerW=Wsvg-M.l-M.r, innerH=Hsvg-M.t-M.b;

function initCharts(){
  cards.each(function(country){
    const cardEl=this;
    const svg=d3.select(this).append('svg')
      .attr('class','tiny').attr('viewBox',`0 0 ${Wsvg} ${Hsvg}`)
      .attr('preserveAspectRatio','xMinYMin meet');
    const g=svg.append('g').attr('transform',`translate(${M.l},${M.t})`);

    g.append('line').attr('class','x0').attr('x1',0).attr('x2',innerW).attr('y1',0).attr('y2',0).attr('stroke','#e3e3e3');
    g.append('path').attr('class','area').attr('fill','var(--fill)');              // wage area
    g.append('path').attr('class','line').attr('fill','none').attr('stroke','var(--line)').attr('stroke-width',2).attr('stroke-linecap','round'); // main (or infl in combo)
    g.append('path').attr('class','line2').attr('fill','none').attr('stroke-width',2).attr('stroke-linecap','round'); // rebased in combo
    g.append('path').attr('class','between').attr('fill','rgba(0,0,0,.045)').style('opacity',0); // between area
    g.append('circle').attr('class','last').attr('r',2.6).attr('fill','var(--line)').style('display','none');

    const dot=g.append('circle').attr('class','hover-dot').attr('r',4).attr('fill','red').style('display','none');

    function nearestValidIndex(series, idx){
      if(series[idx] && series[idx].value!=null) return idx;
      let L=idx-1, R=idx+1;
      while(L>=0 || R<series.length){
        if(L>=0 && series[L].value!=null) return L;
        if(R<series.length && series[R].value!=null) return R;
        L--; R++;
      }
      return null;
    }

    g.append('rect').attr('width',innerW).attr('height',innerH).attr('fill','transparent')
      .on('mousemove',function(event){
        if(sticky) return;
        const [mx]=d3.pointer(event,this);
        let idx=Math.round(x.invert(mx));
        idx=Math.max(0,Math.min(columns.length-1,idx));

        if(currentType !== 'combo'){
          const series = getSeriesByKey(currentType, country.name);
          const valid=nearestValidIndex(series, idx);
          if(valid==null) return;
          const pt=series[valid];
          focusOnly(cardEl); hideAllDots();
          dot.style('display','block').attr('cx',x(valid)).attr('cy',y(pt.value));
          updateTooltipSingle(country.code, country.name, pt.year, pt.value, currentType==='wage');
          showTooltip();
        }else{
          const { infl, reb } = getSeriesAll(country.name);
          const label = infl[idx]?.year || reb[idx]?.year || '';
          const iv = infl[idx]?.value ?? null;
          const rv = reb[idx]?.value ?? null;
          focusOnly(cardEl); hideAllDots();
          const v = (iv!=null) ? iv : rv;
          if(v!=null) dot.style('display','block').attr('cx',x(idx)).attr('cy',y(v));
          updateTooltipCombo(country.code, country.name, label, iv, rv);
          showTooltip();
        }
      })
      .on('mouseenter',function(){ if(!sticky) focusOnly(cardEl); })
      .on('mouseleave',function(){
        if(sticky && stickyCard===cardEl) return;
        if(!sticky){ clearFocus(); hideTooltip(); }
        dot.style('display','none');
      })
      .on('click',function(event){
        const [mx,my]=d3.pointer(event,this);
        let idx=Math.round(x.invert(mx));
        idx=Math.max(0,Math.min(columns.length-1,idx));

        if(currentType !== 'combo'){
          const series = getSeriesByKey(currentType, country.name);
          const valid=nearestValidIndex(series, idx);
          if(valid==null){ clearSticky(); return; }
          const px=x(valid), py=y(series[valid].value);
          const dist=Math.hypot(mx-px, my-py);
          const dotSel = d3.select(cardEl).select('.hover-dot');
          if(dist <= POINT_TOL){
            sticky=true; stickyCard=cardEl; stickyIdx=valid;
            focusOnly(cardEl); hideAllDots();
            dotSel.style('display','block').attr('cx',px).attr('cy',py);
            const pt=series[valid];
            updateTooltipSingle(country.code, country.name, pt.year, pt.value, currentType==='wage');
            showTooltip();
          }else{ clearSticky(); }
        }else{
          const { infl, reb } = getSeriesAll(country.name);
          const iv = infl[idx]?.value ?? null;
          const rv = reb[idx]?.value ?? null;
          const v = (iv!=null) ? iv : rv;
          if(v==null){ clearSticky(); return; }
          const px=x(idx), py=y(v);
          const dist=Math.hypot(mx-px, my-py);
          if(dist <= POINT_TOL){
            sticky=true; stickyCard=cardEl; stickyIdx=idx;
            focusOnly(cardEl); hideAllDots();
            d3.select(cardEl).select('.hover-dot').style('display','block').attr('cx',px).attr('cy',py);
            const label = infl[idx]?.year || reb[idx]?.year || '';
            updateTooltipCombo(country.code, country.name, label, iv, rv);
            showTooltip();
          }else{ clearSticky(); }
        }
      });

    d3.select(this)
      .on('mouseenter', ()=>{ if(!sticky) focusOnly(cardEl); })
      .on('mouseleave', ()=>{ if(!sticky) clearFocus(); });
  });

  renderType('wage');
}

/* Theme per tab */
function applyTheme(){
  if(currentType === 'wage'){
    document.documentElement.style.setProperty('--line', '#0B3D56');
    document.documentElement.style.setProperty('--fill', 'rgba(11,61,86,.16)');
 }else if(currentType === 'infl'){
  document.documentElement.style.setProperty('--line', '#C35A08');
  document.documentElement.style.setProperty('--fill', 'rgba(195,90,8,.12)'); // light shade for inflation
}else{ // combo uses explicit colors per line later
    document.documentElement.style.setProperty('--line', '#0B3D56');
    document.documentElement.style.setProperty('--fill', 'rgba(0,0,0,0)');
  }
}

/* Build polygon path between two series where both have values */
function makeBetweenPath(a, b){
  const n = Math.min(a.length, b.length);
  let top = [], bot = [];
  for(let i=0;i<n;i++){
    const av = a[i].value, bv = b[i].value;
    if(av!=null && bv!=null){
      top.push([x(i), y(av)]);
      bot.push([x(i), y(bv)]);
    }
  }
  if(top.length < 2) return null;
  // keep order: top forward, bot backward
  return "M" + top.map(p=>p.join(",")).join("L") +
         "L" + bot.reverse().map(p=>p.join(",")).join("L") + "Z";
}

/* Render per tab */
function renderType(nextKey){
  currentType = nextKey; // 'wage' | 'infl' | 'combo'
  clearSticky();
  applyTheme();
  tooltip.classList.toggle('combo', currentType==='combo');

  const isInflation = (currentType === 'infl');
  const isWage      = (currentType === 'wage');
  const isCombo     = (currentType === 'combo');

  // X scale
  x = d3.scaleLinear().domain([0, columns.length - 1]).range([0, innerW]);

  // Y scale
  if(isCombo){
    y = d3.scaleLinear().domain([95, 340]).range([innerH, 0]);  // requested fixed range
  }else if(isInflation){
    y = d3.scaleLinear().domain([70, 180]).nice().range([innerH, 0]);
  }else{
    const maxW = maxByType.get(TYPE_KEYS.wage) || 1;
    y = d3.scaleLinear().domain([0, maxW]).nice().range([innerH, 0]);
  }

  const baseline = y(isInflation ? 70 : 0);
  d3.selectAll('.x0').attr('y1', baseline).attr('y2', baseline);

  const lineGen = d3.line().x((d,i)=>x(i)).y(d=>y(d.value)).defined(d=>d.value!=null).curve(d3.curveMonotoneX);
  const areaGen = d3.area().x((d,i)=>x(i)).y0(y(isInflation ? 70 : 0)).y1(d=>y(d.value)).defined(d=>d.value!=null).curve(d3.curveMonotoneX);

  if(!isCombo){
    // Wage or Inflation (NO animation here)
    cards.each(function(country){
      const series = getSeriesByKey(currentType, country.name);
      const g = d3.select(this).select('g');

      // area only for wage
      g.select('path.area')
  .style('opacity', (isWage || isInflation) ? 1 : 0)
  .attr('d', (isWage || isInflation) ? areaGen(series) : null);

      // main line
      g.select('path.line')
        .style('stroke', isWage ? '#0B3D56' : '#C35A08')
        .attr('stroke-dasharray', null).attr('stroke-dashoffset', null)
        .attr('d', lineGen(series));

      // clear combo artifacts
      g.select('path.line2').attr('d', null).attr('stroke-dasharray', null).attr('stroke-dashoffset', null);
      g.select('path.between').style('opacity',0).attr('d', null);

      // last dot for single series
      const lastIdx = [...series].map((d,i)=>({d,i})).reverse().find(o=>o.d.value!=null)?.i ?? null;
      const last = g.select('circle.last');
      if (lastIdx != null) last.style('display', null).attr('cx', x(lastIdx)).attr('cy', y(series[lastIdx].value));
      else last.style('display','none');

      g.select('.hover-dot').style('display','none');
    });
    return;
  }

  // Combination tab: two lines animate, then between-shade appears last
  cards.each(function(country){
    const g = d3.select(this).select('g');
    const { infl, reb } = getSeriesAll(country.name);

    // hide wage area; reset between
    const between = g.select('path.between').style('opacity',0).attr('d', null);
    g.select('path.area').style('opacity',0).attr('d', null);

    const lineInfl = g.select('path.line').style('stroke','#C35A08');
    const lineReb  = g.select('path.line2').style('stroke','#0B3D56');

    const d1 = lineGen(infl);
    const d2 = lineGen(reb);

    // Draw initial paths so we can measure length; they can be null if series is all-null
    lineInfl.attr('d', d1 || null);
    lineReb .attr('d', d2 || null);

    function pathLength(sel){
      const node = sel.node();
      try{
        return (node && sel.attr('d')) ? node.getTotalLength() : 0;
      }catch(e){ return 0; }
    }
    const L1 = pathLength(lineInfl);
    const L2 = pathLength(lineReb);

    // Prepare stroke-dash for animation only if path exists
    if(L1>0){
      lineInfl.interrupt().attr('stroke-dasharray', `${L1} ${L1}`).attr('stroke-dashoffset', L1);
    }else{
      lineInfl.attr('stroke-dasharray', null).attr('stroke-dashoffset', null);
    }
    if(L2>0){
      lineReb.interrupt().attr('stroke-dasharray', `${L2} ${L2}`).attr('stroke-dashoffset', L2);
    }else{
      lineReb.attr('stroke-dasharray', null).attr('stroke-dashoffset', null);
    }

    const dur = 1000;

    const showBetween = ()=>{
      // Only shade if we truly have both lines with some overlap
      const poly = makeBetweenPath(infl, reb);
      if(poly){
        between.attr('d', poly)
               .lower()                 // behind lines but above baseline
               .transition().duration(200).style('opacity',1);
      }
    };

    const animateReb = ()=>{
      if(L2>0){
        lineReb.transition().duration(dur).attr('stroke-dashoffset', 0).on('end', showBetween);
      }else{
        // No rebased line → no between area
        showBetween(); // will no-op since poly is null
      }
    };

    if(L1>0){
      lineInfl.transition().duration(dur).attr('stroke-dashoffset', 0).on('end', animateReb);
    }else{
      // If inflation is missing (unlikely), try animating rebased directly
      animateReb();
    }

    // hide last-dot in combo
    g.select('circle.last').style('display','none');
    g.select('.hover-dot').style('display','none');
  });
}

/* Click outside tiles clears sticky */
document.addEventListener('click', (e)=>{ if(!e.target.closest('.card')) clearSticky(); });

/* Keep layout on resize */
window.addEventListener('resize',()=>{
  const pos=d=>({left:gap()+d.col*(w()+gap()), top:gap()+(d.row+TOP_BUFFER_ROWS)*(h()+gap())});
  d3.selectAll('.card').style('left',d=>pos(d).left+'px').style('top',d=>pos(d).top+'px');
});
