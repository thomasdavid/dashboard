<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EWCS Dashboard (Feather / ArrowJS)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://code.highcharts.com/highcharts.js"></script>
<style>
  :root{--bg:#0c1022;--panel:#12193a;--muted:#9aa4b2;--text:#eef2f8;--accent:#3b82f6}
  *{box-sizing:border-box}body{margin:0;color:var(--text);background:#0e1530;font:14px/1.45 system-ui,Segoe UI,Roboto,Arial}
  header{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  h1{margin:0;font-size:18px}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
  .card{background:var(--panel);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  select,button,input[type="text"]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0f1837;color:var(--text)}
  button{cursor:pointer;background:#18235a}button:hover{background:#203072}
  .survey-buttons{display:flex;flex-wrap:wrap;gap:8px}
  .survey-buttons button{width:auto;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:#162258}
  .survey-buttons button.active{background:var(--accent);color:#fff;border-color:transparent}
  #log{font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:6px}
</style>
</head>
<body>
<header><h1>EWCS Dashboard</h1></header>

<div class="wrap">
  <div class="grid">
    <div class="card">
      <label>Feather source (remote in this repo)</label>
      <input id="remoteUrl" type="text" value="https://raw.githubusercontent.com/thomasdavid/dashboard/main/EWCS_combined_narrow.feather">
      <div style="margin:8px 0;text-align:center">— or —</div>
      <input id="localFeather" type="file" accept=".feather,.arrow" />
      <div id="log"></div>
    </div>
    <div class="card">
      <label>Surveys</label>
      <div class="survey-buttons" id="surveys"></div>
    </div>
    <div class="card">
      <label for="question">Question</label>
      <select id="question"></select>
    </div>
  </div>
  <div style="margin-top:12px" class="grid">
    <div class="card"><label>&nbsp;</label><button id="loadBtn">Load / Reload</button></div>
    <div class="card">
      <label for="limitCountries">Max countries</label>
      <select id="limitCountries">
        <option value="9999" selected>All</option>
        <option value="30">30</option><option value="25">25</option>
        <option value="20">20</option><option value="15">15</option>
      </select>
    </div>
    <div class="card">
      <label for="minPerc">Hide slices ≤ (%)</label>
      <select id="minPerc">
        <option value="0" selected>0</option><option value="0.5">0.5</option>
        <option value="1">1</option><option value="2">2</option><option value="5">5</option>
      </select>
    </div>
  </div>
  <div id="chart" style="height:900px;margin-top:18px"></div>
</div>

<!-- Arrow JS as an ES module -->
<script type="module">
/* -------- High-level config -------- */
const FEATHER_URL_INPUT = 'https://raw.githubusercontent.com/thomasdavid/dashboard/main/EWCS_combined_narrow.feather';

/* UI helpers */
const logEl = document.getElementById('log') ?? (() => {
  const d = document.createElement('div'); d.id='log'; d.style='font:12px/1.4 monospace;color:#9aa4b2;margin-top:6px;white-space:pre-wrap';
  document.querySelector('.card')?.appendChild(d); return d;
})();
const log = (m)=>{ logEl.textContent += m + '\n'; };

/* Try Arrow ESM first, then UMD fallback */
async function loadArrow() {
  // 1) ESM path
  try {
    log('Loading Arrow (ESM)…');
    const mod = await import('https://cdn.jsdelivr.net/npm/apache-arrow@14.0.2/esm/index.min.js');
    if (mod?.tableFromIPC) {
      log('Arrow ESM loaded.');
      return { tableFromIPC: mod.tableFromIPC };
    }
    log('Arrow ESM has no exports, trying UMD…');
  } catch (e) {
    log('Arrow ESM failed: ' + (e?.message || e) + ' — trying UMD…');
  }

  // 2) UMD fallback
  await new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/apache-arrow@14.0.2/bundles/arrow.es2015.min.js';
    s.onload = resolve; s.onerror = ()=>reject(new Error('Failed to load Arrow UMD'));
    document.head.appendChild(s);
  });
  const api = window.arrow;
  if (!api?.tableFromIPC) throw new Error('Arrow UMD loaded but tableFromIPC missing');
  log('Arrow UMD loaded.');
  return { tableFromIPC: api.tableFromIPC };
}

/* Tiny helpers */
function distinct(a){ return [...new Set(a.filter(x=>x!==null && x!==undefined))]; }
function numAwareSort(a,b){ const na=+a, nb=+b; return (!Number.isNaN(na)&&!Number.isNaN(nb)) ? na-nb : String(a).localeCompare(String(b)); }

/* Main */
(async () => {
  try {
    document.getElementById('remoteUrl').value = FEATHER_URL_INPUT;

    const { tableFromIPC } = await loadArrow();

    async function getFeatherBuffer(){
      const file = document.getElementById('localFeather').files?.[0];
      if (file){ log('Reading local Feather…'); return new Uint8Array(await file.arrayBuffer()); }
      const url = document.getElementById('remoteUrl').value.trim();
      log('Fetching Feather…'); const r = await fetch(url, {cache:'no-store'});
      if (!r.ok) throw new Error(`Feather HTTP ${r.status} ${r.statusText}`);
      return new Uint8Array(await r.arrayBuffer());
    }

    async function loadAll(){
      logEl.textContent = '';
      const buf = await getFeatherBuffer();
      const table = tableFromIPC(buf);
      log(`Feather loaded. Rows: ${table.numRows}`);

      // Build controls
      const col = name => table.getChild(name)?.toArray() ?? [];
      const surveys = distinct(col('survey')).sort();
      const surveysBox = document.getElementById('surveys');
      surveysBox.innerHTML='';
      let currentSurvey = surveys[0];

      const addSurveyBtn = (s, active=false) => {
        const b = document.createElement('button');
        b.textContent=s; if(active) b.classList.add('active');
        b.onclick = ()=>{ [...surveysBox.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentSurvey=s; refresh(); };
        surveysBox.appendChild(b);
      };
      surveys.forEach((s,i)=>addSurveyBtn(s, i===0));

      const qSelect = document.getElementById('question');

      function refresh(){
        // questions for survey
        const sArr = col('survey'), qArr = col('question');
        const mask = sArr.map((sv,i)=>sv===currentSurvey);
        const qs = distinct(qArr.filter((q,i)=>mask[i])).sort();
        qSelect.innerHTML=''; qs.forEach((q,i)=>{ const o=document.createElement('option'); o.value=q; o.textContent=q; if(i===0) o.selected=true; qSelect.appendChild(o); });
        draw();
      }

      function draw(){
        const question = qSelect.value;
        const sArr = col('survey'), qArr = col('question'), cArr = col('country'), vArr = col('value');

        // filter
        const rows = [];
        for (let i=0;i<table.numRows;i++){
          if (sArr[i]===currentSurvey && qArr[i]===question){
            rows.push([String(cArr[i]), vArr[i]==null?'NA':String(vArr[i])]);
          }
        }

        // counts and % by country
        const countries = distinct(rows.map(r=>r[0])).sort(numAwareSort);
        const values    = distinct(rows.map(r=>r[1])).sort(numAwareSort);
        const counts = new Map(); const key = (c,v)=>c+'\u0001'+v;
        rows.forEach(([c,v])=>counts.set(key(c,v),(counts.get(key(c,v))||0)+1));
        const totals = new Map(countries.map(c=>[c,0]));
        countries.forEach(c=> values.forEach(v=> totals.set(c, totals.get(c)+(counts.get(key(c,v))||0)) ));

        const minPerc = parseFloat(document.getElementById('minPerc').value)||0;
        const series = values.map(v=>({
          name:v,
          data:countries.map(c=>{
            const pct = 100 * (counts.get(key(c,v))||0) / (totals.get(c)||1);
            return pct <= minPerc ? 0 : pct;
          })
        }));

        Highcharts.chart('chart',{
          chart:{ type:'bar', backgroundColor:'transparent' },
          title:{ text:`${currentSurvey} • ${question} — Distribution by country`, style:{color:'#eef2f8'} },
          xAxis:{ categories:countries, labels:{ style:{color:'#eef2f8'} } },
          yAxis:{ min:0, max:100, title:{ text:'Percent', style:{color:'#eef2f8'} }, labels:{ format:'{value}%', style:{color:'#eef2f8'} } },
          legend:{ itemStyle:{color:'#eef2f8'} },
          tooltip:{ pointFormatter(){ return `<b>${this.series.name}</b>: ${this.y.toFixed(1)}%`; } },
          plotOptions:{ series:{ stacking:'percent' } },
          credits:{ enabled:false }, exporting:{ enabled:false },
          series
        });
      }

      qSelect.onchange = ()=>draw();
      document.getElementById('limitCountries').onchange = ()=>draw();
      document.getElementById('minPerc').onchange = ()=>draw();
      refresh();
    }

    // Hook the button
    document.getElementById('loadBtn').onclick = ()=>loadAll();
    // Auto-load
    document.getElementById('loadBtn').click();

  } catch(e) {
    log('Fatal error: ' + (e?.message || e));
    console.error(e);
  }
})();
</script>

</body>
</html>
